<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier Governance</title>
<style>
  :root{
    --gray900:#212121; --gray800:#575c62; --gray700:#767c84; --gray400:#C4C4C4;
    --gray300:#E0E0E0; --gray200:#E7E7E7; --gray100:#EFEFF0; --gray50:#F6F7F8;
    --highlight:#2FC7BA; --highlight-darker:#1a9c90; --bg:#ffffff;
    --highlight-text:#ffffff; --text:#1b1b1b; --secondary-text:#575c62;
    --error:#f44336; --notify:#f0512a; --status:#d7efec;
    --msg-bg:#ecf0f6; --msg-self-bg:#2FC7BA; --msg-self-text:#ffffff;
    --radius:12px; --radius-sm:8px;
    --shadow:0 1px 2px rgba(33,33,33,.04), 0 6px 20px -10px rgba(33,33,33,.15);
    --sidebar-w:250px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{font-size:16.5px}   /* root bump -> every rem-based size grows a little on all pages */
  body{margin:0;background:var(--gray50);color:var(--text);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--highlight-darker);text-decoration:none}
  h2{font-size:1.2rem;margin:0 0 .2rem;font-weight:650}
  h3{font-size:1rem;margin:0 0 .5rem;font-weight:650}
  .muted{color:var(--secondary-text);font-size:.86rem}
  code,.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.85em}

  /* layout */
  .app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100vh}
  aside{background:var(--bg);border-right:1px solid var(--gray200);display:flex;flex-direction:column;min-width:0}
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;padding:1.05rem 1.25rem;border-bottom:1px solid var(--gray100)}
  .brand-logo{height:30px;width:auto;max-width:190px;display:block}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--highlight),#5ad6cb);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.05rem;box-shadow:var(--shadow)}
  .brand b{font-size:1rem;font-weight:700;letter-spacing:-.01em}
  .brand .sub{font-size:.68rem;color:var(--secondary-text);text-transform:uppercase;letter-spacing:.14em;font-weight:600;padding-left:2px}
  nav{padding:.75rem .6rem;overflow-y:auto;flex:1}
  nav .group{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--gray700);
    padding:.9rem .7rem .35rem;font-weight:600}
  nav a.item{display:flex;align-items:center;gap:.7rem;padding:.6rem .7rem;border-radius:var(--radius-sm);
    color:var(--gray800);font-weight:550;cursor:pointer;margin:.1rem 0;transition:background .12s,color .12s}
  nav a.item:hover{background:var(--gray50)}
  nav a.item.active{background:var(--highlight);color:var(--highlight-text);box-shadow:var(--shadow)}
  nav a.item .ic{width:1.2rem;text-align:center;font-size:1rem}
  .who{border-top:1px solid var(--gray100);padding:.85rem 1.25rem;display:flex;align-items:center;gap:.6rem}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--status);color:var(--highlight-darker);
    display:grid;place-items:center;font-weight:700;font-size:.8rem}
  .who .n{font-weight:600;font-size:.85rem;line-height:1.15}
  .who .r{font-size:.72rem;color:var(--secondary-text)}
  .who button{margin-left:auto}

  main{overflow-y:auto;min-width:0}
  .topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--gray200);padding:1rem 1.75rem;display:flex;align-items:center;gap:1rem}
  .topbar h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:-.015em}
  .topbar .desc{color:var(--secondary-text);font-size:.85rem}
  .content{padding:1.5rem 1.75rem;max-width:1100px}

  /* components */
  .card{background:var(--bg);border:1px solid var(--gray200);border-radius:var(--radius);
    padding:1.25rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
  .card > h2{margin-bottom:.15rem}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem}
  label{display:flex;flex-direction:column;gap:.28rem;font-size:.8rem;color:var(--secondary-text);font-weight:600}
  input,select,textarea{font:inherit;font-size:.88rem;padding:.55rem .65rem;border:1px solid var(--gray300);
    border-radius:var(--radius-sm);background:var(--bg);color:var(--text);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--highlight);outline-offset:0;border-color:transparent}
  textarea{font-family:ui-monospace,Consolas,monospace;resize:vertical}
  button{font:inherit;cursor:pointer;border:0;border-radius:var(--radius-sm);padding:.55rem 1rem;
    background:var(--highlight);color:var(--highlight-text);font-weight:600;transition:background .12s,transform .05s}
  button:hover{background:var(--highlight-darker)} button:active{transform:translateY(1px)}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;color:var(--gray800);border:1px solid var(--gray300)}
  button.ghost:hover{background:var(--gray50);color:var(--text)}
  button.sm{padding:.32rem .6rem;font-size:.78rem;font-weight:600}
  button.danger{background:transparent;color:var(--error);border:1px solid var(--gray300)}
  button.danger:hover{background:#fdecea;border-color:var(--error)}

  table{border-collapse:collapse;width:100%;font-size:.86rem}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--gray200);border-radius:var(--radius);background:var(--bg);box-shadow:var(--shadow)}
  th,td{text-align:left;padding:.65rem .8rem;border-bottom:1px solid var(--gray100);vertical-align:top}
  thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--gray700);background:var(--gray50)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--gray50)}

  .pill{display:inline-block;border-radius:100px;padding:.12rem .55rem;font-size:.72rem;font-weight:600;background:var(--gray100);color:var(--gray800)}
  .pill.ok{background:var(--status);color:var(--highlight-darker)}
  .pill.warn{background:#fdecea;color:var(--error)}
  .pill.pending{background:#fff4e5;color:#b26a00}
  .key{background:#fff;border:1px dashed var(--highlight);color:var(--text);padding:.7rem .8rem;border-radius:var(--radius-sm);
    font-family:ui-monospace,Consolas,monospace;word-break:break-all;margin-top:.6rem}
  .err{color:var(--error);font-size:.85rem;min-height:1.1rem;margin:.3rem 0}
  .empty{color:var(--secondary-text);padding:1rem;text-align:center;font-size:.85rem}
  .toast{position:fixed;bottom:1.25rem;right:1.25rem;background:var(--gray900);color:#fff;padding:.7rem 1rem;
    border-radius:var(--radius-sm);box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;z-index:50}
  .toast.show{opacity:1;transform:none}

  /* chat */
  .chat{display:flex;flex-direction:column;height:calc(100vh - 66px)}
  .chatlog{flex:1;overflow-y:auto;padding:1.5rem 1.75rem;display:flex;flex-direction:column;gap:.7rem}
  .msg{padding:.65rem .9rem;border-radius:14px;max-width:70%;white-space:pre-wrap;word-wrap:break-word;box-shadow:var(--shadow)}
  .msg.me{align-self:flex-end;background:var(--msg-self-bg);color:var(--msg-self-text);border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--msg-bg);border:1px solid var(--gray200);border-bottom-left-radius:4px;
    white-space:normal;color:var(--text)}
  .msg.bot p{margin:0} .msg.bot div+div{margin-top:.15rem}
  .msg.bot ul{margin:.35rem 0;padding-left:1.25rem} .msg.bot li{margin:.12rem 0}
  .msg.bot strong{font-weight:700} .msg.bot em{font-style:italic}
  .msg.bot code{background:rgba(33,33,33,.07);padding:.05rem .3rem;border-radius:4px;
    font-family:ui-monospace,Consolas,monospace;font-size:.85em}
  .msg.bot .mdspace{height:.55rem}
  .typing{display:inline-flex;gap:5px;align-items:center;height:1.1rem}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--secondary-text);display:inline-block;
    animation:tdot 1.2s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
  @keyframes tdot{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
  @media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.5}}
  .tools{align-self:flex-start;color:var(--secondary-text);font-size:.72rem;font-family:ui-monospace,Consolas,monospace}
  .chatbar{display:flex;gap:.6rem;padding:1rem 1.75rem;border-top:1px solid var(--gray200);background:var(--bg)}
  .chatbar input{flex:1}
  .hint{margin:auto;color:var(--secondary-text);text-align:center;max-width:30rem}

  @media (max-width:820px){
    .app{grid-template-columns:1fr} aside{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);
      transform:translateX(-100%);transition:.2s;z-index:30} aside.open{transform:none}
    .menu-btn{display:inline-grid!important}
  }
  .menu-btn{display:none;place-items:center;background:transparent;color:var(--text);border:1px solid var(--gray300);
    width:38px;height:38px;padding:0}

  /* ── security analytics: KPIs, charts, heatmap, drawer ── */
  .num{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:.4rem}
  .kpi{background:var(--bg);border:1px solid var(--gray200);border-radius:var(--radius);padding:.8rem .95rem;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .lab{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--gray700);font-weight:650}
  .kpi .val{font-family:ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:600;margin-top:.15rem;letter-spacing:-.02em}
  .kpi .val small{font-size:.8rem;color:var(--gray700);font-weight:500}
  .kpi.alert .val{color:var(--error)} .kpi.alert .lab{color:var(--error)}
  .kpi .spark{position:absolute;right:6px;bottom:6px;width:64px;height:26px;opacity:.85}
  .section-head{display:flex;align-items:baseline;gap:.5rem;margin:1.5rem 0 0}
  .section-head h2{font-size:1rem} .section-head .muted{font-size:.78rem}
  .charts{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-top:.7rem}
  .charts .card{margin:0;padding:1rem} .chart-t{font-weight:650;font-size:.85rem} .chart-s{font-size:.72rem;color:var(--gray700);margin:.05rem 0 .55rem}
  .span2{grid-column:span 2}
  .donut-row{display:flex;gap:1rem;align-items:center}
  .legend{display:flex;flex-direction:column;gap:.35rem;flex:1;min-width:0}
  .legend .lg{display:flex;align-items:center;gap:.45rem;font-size:.76rem;color:var(--secondary-text)}
  .legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
  .legend .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legend b{margin-left:auto;font-family:ui-monospace,Consolas,monospace}
  .hbars{display:flex;flex-direction:column;gap:.5rem}
  .hbar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 40px;align-items:center;gap:.6rem;font-size:.78rem}
  .hbar .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--secondary-text)}
  .hbar .trk{background:var(--gray100);border-radius:100px;height:8px;overflow:hidden}
  .hbar .fil{height:100%;background:var(--highlight);border-radius:100px}
  .hbar .hv{text-align:right;font-family:ui-monospace,Consolas,monospace}
  .barchart{width:100%;height:auto;overflow:visible} .barchart text{fill:var(--gray700);font-size:10px}
  svg text.dn{font-family:ui-monospace,Consolas,monospace}
  .heat{display:grid;grid-template-columns:auto repeat(24,1fr);gap:2px;font-size:.6rem}
  .heat .hd{color:var(--gray700);text-align:center;font-size:.55rem}
  .heat .rl{color:var(--gray700);padding-right:.35rem;text-align:right;align-self:center}
  .heat .cell{aspect-ratio:1;border-radius:2px;background:var(--gray100)}
  .seg{display:inline-flex;border:1px solid var(--gray300);border-radius:var(--radius-sm);overflow:hidden}
  .seg button{background:var(--bg);color:var(--secondary-text);padding:.32rem .62rem;font-size:.76rem;font-weight:600;border:0;border-right:1px solid var(--gray200)}
  .seg button:last-child{border-right:0} .seg button.on{background:var(--status);color:var(--highlight-darker)}
  .pill.sev-critical{background:#fdecea;color:var(--error)}
  .pill.sev-high{background:#ffe7dd;color:var(--notify)}
  .pill.sev-medium{background:#fff4e5;color:#b26a00}
  .pill.sev-low{background:var(--gray100);color:var(--gray800)}
  .sevbar{width:4px;border-radius:3px;align-self:stretch;min-height:34px}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:93vw;background:var(--bg);border-left:1px solid var(--gray200);
    box-shadow:-12px 0 48px -18px rgba(33,33,33,.4);z-index:60;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer .dh{padding:1.05rem 1.2rem;border-bottom:1px solid var(--gray100);display:flex;gap:.7rem;align-items:flex-start}
  .drawer .db{padding:1.1rem 1.2rem;overflow-y:auto;display:flex;flex-direction:column;gap:1rem}
  .backdrop{position:fixed;inset:0;background:rgba(33,33,33,.28);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
  .backdrop.open{opacity:1;pointer-events:auto}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:.7rem .9rem}
  .kv .k,.klbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gray700);font-weight:650}
  .kv .v{font-size:.85rem;margin-top:.1rem;word-break:break-word}
  @media (max-width:820px){.kpis,.charts{grid-template-columns:1fr 1fr}.span2{grid-column:auto}}

  /* ── quick asks, reply actions, structured results, home ── */
  .qa-group{margin-bottom:.7rem} .qa-group:last-child{margin-bottom:0}
  .qa-label{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--gray700);font-weight:650;margin-bottom:.35rem}
  .qa-chips{display:flex;flex-wrap:wrap;gap:.4rem}
  .qa-chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--bg);border:1px solid var(--gray300);
    border-radius:100px;padding:.32rem .75rem;font:inherit;font-size:.8rem;color:var(--text);cursor:pointer;transition:.12s}
  .qa-chip:hover{border-color:var(--highlight);background:var(--status);color:var(--highlight-darker)}
  .qa-del{background:none;border:0;color:inherit;opacity:.5;cursor:pointer;padding:0;font-size:.72rem;line-height:1}
  .qa-del:hover{opacity:1}
  .msg-actions{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.5rem;opacity:0;transition:opacity .12s}
  .msg.bot:hover .msg-actions{opacity:1}
  .msg-actions button{background:none;border:0;color:var(--secondary-text);cursor:pointer;font:inherit;font-size:.72rem;padding:.1rem .2rem}
  .msg-actions button:hover{color:var(--text)} .msg-actions button.on{color:var(--highlight-darker);font-weight:600}
  .followups{display:flex;flex-wrap:wrap;gap:.4rem;align-self:flex-start;max-width:75%}
  .mdtable-wrap{overflow-x:auto;margin:.45rem 0}
  .mdtable{border-collapse:collapse;font-size:.9em;width:100%}
  .mdtable th,.mdtable td{border:1px solid var(--gray300);padding:.32rem .55rem;text-align:left;white-space:nowrap}
  .mdtable th{background:var(--gray100);font-weight:650}
  .mdcode{background:var(--gray900);color:#e9edf0;border-radius:8px;padding:.6rem .8rem;overflow-x:auto;font-size:.8em;margin:.45rem 0}
  .mdcode code{background:none;color:inherit;padding:0}
  .mdh{font-weight:700;margin:.35rem 0 .1rem}
  .pg-task{transition:border-color .12s,box-shadow .12s}
  .pg-task:hover{border-color:var(--highlight);box-shadow:var(--shadow)}
  .home-hero{background:linear-gradient(120deg,var(--status),transparent)}
  .home-hero h2{font-size:1.35rem}

  /* ── My Workflow: hand-rolled graph canvas (no external library) ── */
  .wf-pal-item{border:1px solid var(--gray200);border-radius:var(--radius-sm);padding:.5rem .6rem;margin-bottom:.4rem;
    cursor:grab;background:var(--bg);transition:border-color .12s}
  .wf-pal-item:hover{border-color:var(--highlight)}
  .wf-pal-item.locked{opacity:.5;cursor:not-allowed}
  .wf-pal-item .t{font-weight:650;font-size:.82rem;display:flex;justify-content:space-between;gap:.4rem;align-items:center}
  .wf-pal-item .d{font-size:.72rem;color:var(--secondary-text);margin-top:.15rem}
  .wf-pal-group{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--gray700);font-weight:650;margin:.7rem 0 .35rem}
  .wf-pal-group:first-child{margin-top:0}
  .wf-canvas-wrap{overflow:auto;position:relative;padding:0!important}
  .wf-canvas{position:relative}
  .wf-canvas.dragover{outline:2px dashed var(--highlight);outline-offset:-2px}
  .wf-edges{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
  .wf-node{position:absolute;width:190px;border:1px solid var(--gray300);border-radius:var(--radius-sm);
    background:var(--bg);box-shadow:var(--shadow);cursor:grab;user-select:none}
  .wf-node.selected{border-color:var(--highlight);box-shadow:0 0 0 2px var(--highlight)}
  .wf-node.needs-gate{border-color:var(--error)}
  .wf-node .hd{padding:.5rem .6rem;border-bottom:1px solid var(--gray100);font-size:.78rem;font-weight:650;
    display:flex;justify-content:space-between;gap:.3rem;align-items:center}
  .wf-node .bd{padding:.45rem .6rem;font-size:.7rem;color:var(--secondary-text)}
  .wf-node .bd .row{gap:.3rem;justify-content:space-between;font-size:.68rem;margin:.1rem 0}
  .wf-port{width:10px;height:10px;border-radius:50%;background:var(--gray400);border:2px solid var(--bg);
    position:absolute;cursor:crosshair;pointer-events:all}
  .wf-port:hover{background:var(--highlight)}
  .wf-port.in{left:-6px}
  .wf-port.out{right:-6px}
  .wf-node-del{background:none;border:0;color:var(--secondary-text);cursor:pointer;font-size:.9rem;line-height:1;padding:0}
  .wf-node-del:hover{color:var(--error)}
  .wf-prop-row{border:1px solid var(--gray200);border-radius:var(--radius-sm);padding:.5rem .6rem;margin-bottom:.5rem}
  .wf-prop-row label{margin-bottom:.2rem}
  .wf-bound-chip{display:flex;justify-content:space-between;align-items:center;gap:.4rem;background:var(--status);
    color:var(--highlight-darker);border-radius:var(--radius-sm);padding:.4rem .55rem;font-size:.78rem}
  .wf-bound-chip button{background:none;border:0;color:inherit;padding:0;font-size:.75rem;text-decoration:underline}
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="brand">
      <img class="brand-logo" src="/dashboard/logo.png" alt="Frontier Dental">
      <div class="sub" id="brand-sub">MCP</div>
    </div>
    <nav id="nav"></nav>
    <div class="who">
      <div class="avatar" id="avatar">–</div>
      <div><div class="n" id="who-name">…</div><div class="r" id="who-role"></div></div>
      <button class="ghost sm" onclick="logout()">Sign out</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div><h1 id="page-title">…</h1><div class="desc" id="page-desc"></div></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script>
// ── helpers ──────────────────────────────────────────────────────────────────
const $ = (s,r=document)=>r.querySelector(s);
const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Minimal, SAFE markdown -> HTML for assistant replies: everything is escaped
// FIRST, then a small set of inline/line patterns are re-introduced, so nothing
// the model emits can inject markup.
function mdToHtml(src){
  const inline=(t)=>esc(t)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g,'$1<em>$2</em>');
  const cells=(r)=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
  const lines=String(src??'').split('\n');
  const out=[]; let i=0, inList=false;
  const closeList=()=>{ if(inList){out.push('</ul>');inList=false;} };
  while(i<lines.length){
    const line=lines[i].replace(/\s+$/,'');
    if(/^```/.test(line)){                       // fenced code block
      closeList(); i++; const code=[];
      while(i<lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
      i++; out.push('<pre class="mdcode"><code>'+esc(code.join('\n'))+'</code></pre>'); continue;
    }
    if(line.includes('|') && i+1<lines.length && /-/.test(lines[i+1]) && /^[\s:|-]+$/.test(lines[i+1].trim())){
      closeList();                               // GFM table
      const head=cells(line); i+=2; const rows=[];
      while(i<lines.length && lines[i].includes('|') && lines[i].trim()!==''){ rows.push(cells(lines[i])); i++; }
      out.push('<div class="mdtable-wrap"><table class="mdtable"><thead><tr>'+head.map(h=>'<th>'+inline(h)+'</th>').join('')+
        '</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');
      continue;
    }
    const h=line.match(/^(#{1,3})\s+(.*)$/);
    if(h){ closeList(); out.push('<div class="mdh">'+inline(h[2])+'</div>'); i++; continue; }
    const m=line.match(/^\s*[-*]\s+(.*)$/);
    if(m){ if(!inList){out.push('<ul>');inList=true;} out.push('<li>'+inline(m[1])+'</li>'); i++; continue; }
    closeList();
    out.push(line.trim()===''?'<div class="mdspace"></div>':'<div>'+inline(line)+'</div>');
    i++;
  }
  closeList();
  return out.join('');
}

// Shared streaming client: streams the answer from /chat/stream, calling
// onUpdate(text,{tools,phase}) as it arrives; falls back to /chat on any
// streaming failure. Returns {reply, tools, conv}. Used by the Assistant and
// the AI Playground.
async function streamOrChat(message, conv, onUpdate){
  try{
    const r=await fetch('/chat/stream',{method:'POST',credentials:'same-origin',
      headers:{'content-type':'application/json'},body:JSON.stringify({message,conversation_id:conv})});
    const ct=r.headers.get('content-type')||'';
    if(!r.ok||!r.body||!ct.includes('text/event-stream')) throw new Error('stream unavailable');
    const reader=r.body.getReader(), dec=new TextDecoder(); let buf='',text='',tools=[],started=false;
    for(;;){
      const {value,done}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true}); let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const blk=buf.slice(0,i); buf=buf.slice(i+2);
        const dl=blk.split('\n').find(l=>l.startsWith('data:')); if(!dl)continue;
        let ev; try{ev=JSON.parse(dl.slice(5).trim());}catch(e){continue;}
        if(ev.type==='meta'){ if(ev.conversation_id)conv=ev.conversation_id; }
        else if(ev.type==='delta'){ started=true; text+=ev.text||''; onUpdate&&onUpdate(text,{tools,phase:'answer'}); }
        else if(ev.type==='replace'){ text=ev.text||''; onUpdate&&onUpdate(text,{tools,phase:'answer'}); }
        else if(ev.type==='tools'){ tools.push(...(ev.tools||[])); if(!started)onUpdate&&onUpdate('',{tools,phase:'tools'}); }
        else if(ev.type==='done'){ if(ev.tool_calls&&ev.tool_calls.length)tools=ev.tool_calls.map(t=>t.tool); }
        else if(ev.type==='error'){ throw new Error(ev.message||'stream error'); }
      }
    }
    return {reply:text, tools, conv};
  }catch(e){
    // Streaming unavailable / failed mid-flight -> the plain endpoint (records the turn).
    const j=await api('/chat',{method:'POST',body:JSON.stringify({message,conversation_id:conv})});
    return {reply:j.reply||'', tools:(j.tool_calls||[]).map(t=>t.tool), conv:j.conversation_id||conv};
  }
}

// Active conversation id -- sessionStorage (not a bare JS var) so it survives a
// hard refresh/reopened tab too, not just SPA in-app navigation, matching how
// long the server itself considers the conversation alive (GOVERNANCE_CHAT_IDLE_SEC,
// default 1h) rather than only "as long as you don't leave the Assistant panel").

// Namespaced by the logged-in user (ME.name), NOT a single shared key --
// sessionStorage is scoped to the browser TAB, not to who's logged in, and is
// never cleared on logout. Without this namespacing, testing account A then
// logging into account B in the SAME tab would silently hand B the SAME
// conversation_id A was using, sending both users' messages to one session

        :f.type==='textarea'
        ?`<label style="grid-column:1/-1">${esc(f.label)}<textarea data-f="${f.k}" rows="4" placeholder="${esc(f.ph||'')}"></textarea></label>`
        :`<label>${esc(f.label)}<input data-f="${f.k}" placeholder="${esc(f.ph||'')}"></label>`).join('')
      }<label style="grid-column:1/-1">Extra instructions <span class="muted" style="font-weight:400;text-transform:none;letter-spacing:0">(optional — how should it be analyzed?)</span>
        <textarea data-extra rows="2" placeholder="e.g. focus on the last 3 months · flag anything over $10k · keep it to bullet points"></textarea></label></div>
      <div class="row" style="margin-top:.85rem"><button id="pg_run">Run task</button></div></div>`;
    $('#pg_close').onclick=()=>{$('#pg_form').innerHTML='';$('#pg_out').innerHTML='';};
    $('#pg_run').onclick=()=>{
      const vals={}; $('#pg_form').querySelectorAll('[data-f]').forEach(el=>vals[el.dataset.f]=el.value.trim());
      for(const f of t.fields){ if(f.type!=='select' && !vals[f.k]){toast('Please fill in '+f.label,true);return;} }
      let prompt=t.tmpl.replace(/\{(\w+)\}/g,(m,k)=>vals[k]||m);
      const extra=($('#pg_form').querySelector('[data-extra]').value||'').trim();
      if(extra) prompt+='\n\nAdditional instructions from the user: '+extra;
      runTask(prompt);
    };
  }
  async function runTask(prompt){
    $('#pg_out').innerHTML=`<div class="card card-pad"><div class="between"><h2>Result</h2>
        <span class="pill warn">AI draft — review before use</span></div>
      <div class="msg bot" id="pg_reply" style="max-width:100%;margin-top:.7rem"><span class="typing"><i></i><i></i><i></i></span></div>
      <div class="row" id="pg_actions" style="margin-top:.7rem"></div></div>`;
    const rep=$('#pg_reply');
    const onUpdate=(text,meta)=>{
      if(meta.phase==='tools' && !text) rep.innerHTML=`<span class="muted">using: ${esc((meta.tools||[]).join(', '))}…</span>`;
      else rep.innerHTML=mdToHtml(text);
    };
    try{
      const s=await streamOrChat(prompt,'pg-'+Math.random().toString(36).slice(2),onUpdate);
      const reply=s.reply||'(no reply)'; rep.innerHTML=mdToHtml(reply);
      $('#pg_actions').innerHTML=`<button class="ghost sm" id="pg_copy">⧉ Copy</button>`+
        `<button class="ghost sm" id="pg_save">☆ Save</button>`+
        (/\|.*\|/.test(reply)?'<button class="ghost sm" id="pg_csv">⬇ CSV</button>':'')+
        ((s.tools&&s.tools.length)?`<span class="muted" style="font-size:.72rem;align-self:center">used: ${esc(s.tools.join(', '))}</span>`:'');
      $('#pg_copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(reply);toast('Copied');};
      $('#pg_save').onclick=()=>{saveAnswer(reply);toast('Saved to your answers');};
      const csv=$('#pg_csv'); if(csv)csv.onclick=()=>{const tb=rep.querySelector('.mdtable');if(tb)downloadText('result.csv',tableToCsv(tb),'text/csv');};
    }catch(e){rep.innerHTML=`<span class="err">${esc(e.message)}</span>`;}
  }
}

async function renderAssistant(v){
  v.innerHTML=`<div class="chat">
    <div class="row" style="padding:.6rem 1.75rem 0;justify-content:flex-end;gap:.4rem">
      <button id="cexport" class="sm ghost">Export</button>
      <button id="cnew" class="sm ghost">+ New conversation</button></div>
    <div class="chatlog" id="clog">
      <div class="hint" id="chint"></div></div>
    <form class="chatbar" id="cform"><input id="cq" placeholder="Ask a question…" autocomplete="off" autofocus>
      <button id="csave" type="button" class="ghost" title="Save this ask to Quick asks">★</button>
      <button id="csend">Send</button></form></div>`;
  const log=$('#clog'); let conv=getActiveConv();
  $('#chint').innerHTML=`<h3>How can I help?</h3><p class="muted">Ask in plain language — or start with one of these:</p><div id="hint_qa" style="margin-top:.7rem;text-align:left"></div>`;
  renderQuickAsks($('#hint_qa'));

  const add=(cls,txt)=>{const d=el(`<div class="msg ${cls}"></div>`);
    if(cls==='bot')d.innerHTML=mdToHtml(txt); else d.textContent=txt;
    log.appendChild(d);log.scrollTop=log.scrollHeight;return d;};
  const thinking=()=>{const d=el('<div class="msg bot"><span class="typing"><i></i><i></i><i></i></span></div>');
    log.appendChild(d);log.scrollTop=log.scrollHeight;return d;};
  const actionsBar=(reply,p,q)=>{
    const hasTable=!!p.querySelector('.mdtable');
    const bar=el(`<div class="msg-actions"><button data-a="copy">⧉ Copy</button>`+
      (hasTable?'<button data-a="csv">⬇ CSV</button><button data-a="chart">📊 Chart</button>':'')+
      `<button data-a="retry">↻ Retry</button><button data-a="save">☆ Save</button>`+
      `<button data-a="up" title="Helpful">👍</button><button data-a="down" title="Not helpful">👎</button></div>`);
    bar.onclick=async(e)=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
      if(a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(reply);toast('Copied');return;}
      if(a==='csv'){const t=p.querySelector('.mdtable');if(t)downloadText('result.csv',tableToCsv(t),'text/csv');return;}
      if(a==='chart'){const ex=p.querySelector('.reply-chart');if(ex){ex.remove();return;}
        const items=chartFromTable(p.querySelector('.mdtable'));
        if(!items.length){toast('No numeric column to chart',true);return;}
        const c=el('<div class="reply-chart" style="margin-top:.55rem"></div>');c.innerHTML=_hbars(items);p.appendChild(c);return;}
      if(a==='retry'){send(q);return;}
      if(a==='save'){saveAnswer(reply);toast('Saved to your answers');return;}
      try{await api('/dashboard/feedback',{method:'POST',body:JSON.stringify({conversation_id:conv,rating:a})});
        bar.querySelectorAll('[data-a="up"],[data-a="down"]').forEach(x=>x.classList.remove('on'));b.classList.add('on');toast('Thanks for the feedback');}
      catch(err){toast(err.message,true);}};
    return bar;
  };
  const addFollowups=(q,reply)=>{
    const chips=[...LLM_ACTIONS, ...suggestFollowups(q,reply)].filter((c,i,arr)=>arr.indexOf(c)===i).slice(0,5);
    const d=el('<div class="followups"></div>');
    chips.forEach(c=>{const b=el(`<button class="qa-chip"></button>`);b.textContent=c;b.onclick=()=>send(c);d.appendChild(b);});
    log.appendChild(d);log.scrollTop=log.scrollHeight;
  };
  const addWorkflowSuggestions=async(q,reply)=>{
    let data;
    try{data=await api('/workflow-suggestions',{method:'POST',body:JSON.stringify({message:q+'\n'+reply,limit:3})});}
    catch(e){return;}
    const suggestions=data.suggestions||[];
    if(!suggestions.length)return;
    const box=el('<div class="msg bot" style="max-width:760px"></div>');
    box.innerHTML=`<b>Run this as a workflow</b><p class="muted" style="font-size:.78rem;margin:.25rem 0 .55rem">Create governed files, approvals, and audit-backed workflow runs from this request.</p><div class="grid">${suggestions.map(s=>`<div class="card" style="margin:0;padding:.75rem"><div class="row" style="justify-content:space-between"><b>${esc(s.displayName)}</b><span class="pill ok">${esc((s.outputTypes||[]).join(', ')||'workflow')}</span></div><p class="muted" style="font-size:.76rem;margin:.35rem 0">${esc(s.reason)}</p><button class="sm ghost" data-launch-wf="${esc(s.templateId)}" data-inputs="${esc(JSON.stringify(s.inputs||{}))}">Launch</button></div>`).join('')}</div>`;
    box.onclick=async(e)=>{
      const b=e.target.closest('[data-launch-wf]'); if(!b)return;
      b.disabled=true; b.textContent='Launching...';
      try{
        const inputs=JSON.parse(b.dataset.inputs||'{}');
        const r=await api('/workflow-suggestions/launch',{method:'POST',body:JSON.stringify({template_id:b.dataset.launchWf,inputs})});
        toast('Workflow launched');
        const links=(r.artifacts||[]).map(a=>`<a href="${esc(a.downloadUrl)}">${esc(a.filename)}</a>`).join(' | ');
        const out=el('<div class="tools"></div>');
        out.innerHTML=`workflow ${esc(r.status)}: <span class="mono">${esc(r.runId)}</span>${links?' | '+links:''} | <button class="sm ghost" onclick="go('workflows')">Runs</button><button class="sm ghost" onclick="go('files')">Files</button>`;
        log.appendChild(out);log.scrollTop=log.scrollHeight;
      }catch(err){toast(err.message,true);b.disabled=false;b.textContent='Launch';}
    };
    log.appendChild(box);log.scrollTop=log.scrollHeight;
  };

  async function send(q){
    q=(q||'').trim(); if(!q)return;
    log.querySelector('.hint')?.remove();
    log.querySelectorAll('.followups').forEach(f=>f.remove());
    add('me',q); $('#cq').value=''; $('#csend').disabled=true; const p=thinking();
    const onUpdate=(text,meta)=>{
      if(meta.phase==='tools' && !text) p.innerHTML=`<div class="tools">using: ${esc((meta.tools||[]).join(', '))}…</div>`;
      else p.innerHTML=mdToHtml(text);
      log.scrollTop=log.scrollHeight;
    };
    let reply='', tools=[];
    try{
      const s=await streamOrChat(q,conv,onUpdate);
      reply=s.reply||'(no reply)'; tools=s.tools||[];
      if(s.conv){conv=s.conv;setActiveConv(conv);}
      p.innerHTML=mdToHtml(reply);
    }catch(err){p.textContent='⚠ '+err.message;$('#csend').disabled=false;$('#cq').focus();return;}
    p.appendChild(actionsBar(reply,p,q));
    if(tools&&tools.length)log.appendChild(el(`<div class="tools">used: ${esc(tools.join(', '))}</div>`));
    addFollowups(q,reply);
    addWorkflowSuggestions(q,reply);
    $('#csend').disabled=false;$('#cq').focus();
  }

  $('#cform').onsubmit=(e)=>{e.preventDefault();send($('#cq').value);};
  $('#csave').onclick=()=>{const t=$('#cq').value.trim();if(!t){toast('Type an ask first, then save it',true);return;}saveAsk(t);toast('Saved to Quick asks');};
  $('#cnew').onclick=()=>{setActiveConv('chat-'+Math.random().toString(36).slice(2));paint('assistant');};
  $('#cexport').onclick=()=>exportConversation(conv);

  try{
    const t=await api('/dashboard/chat-history/'+encodeURIComponent(conv));
    if(t.messages&&t.messages.length){log.querySelector('.hint')?.remove();t.messages.forEach(m=>add(m.role==='user'?'me':'bot',m.content));}
  }catch(e){/* no history yet for this id -- fine, start fresh */}

  if(PENDING_ASK){const t=PENDING_ASK;PENDING_ASK=null;send(t);}
}

async function renderAccess(v){
  const [a,catalog]=await Promise.all([
    api('/dashboard/my-access'),
    api('/dashboard/category-catalog').catch(()=>({categories:[]})),
  ]);
  const categories=catalog.categories||[];
  const backendLabel=Object.fromEntries(categories.map(c=>[c.backend,c.display_name]));
  const statusPill=a.status==='active'?'ok':(a.status==='pending'?'pending':'warn');
  const access=a.access||{};
  // access[b].tools is now [{name,description}] (see manifest.ToolPolicy.description) --
  // one plain-English line per tool, not the raw canonical name.
  const accessHtml=Object.keys(access).length? Object.entries(access).map(([b,g])=>`
    <div style="margin-bottom:1.1rem">
      <div class="row"><b>${esc(backendLabel[b]||b)}</b>${(g.levels||[]).map(l=>`<span class="pill ok">${esc(l)}</span>`).join(' ')}</div>
      <ul style="margin:.5rem 0 0;padding-left:1.3rem">
        ${(g.tools||[]).map(t=>`<li>${esc(t.description||t.name||t)}</li>`).join('')||'<li class="muted">no tools</li>'}
      </ul></div>`).join('') : '<p class="empty">No access granted yet.</p>';
  const myAccessReqs=(a.requests||[]).filter(r=>r.kind==='access');
  // tools already pending in an earlier, not-yet-decided request (per backend) --
  // only "selections"-shaped requests are relevant here (what this UI now submits).
  const pendingByBackend={};
  myAccessReqs.filter(r=>r.status==='pending'&&r.selections).forEach(r=>r.selections.forEach(s=>{
    (pendingByBackend[s.backend]=pendingByBackend[s.backend]||new Set());
    s.tools.forEach(t=>pendingByBackend[s.backend].add(t));
  }));
  const grantedToolNames=b=>new Set(((access[b]&&access[b].tools)||[]).map(t=>t.name||t));
  const toolDesc=(cat,name)=>{const c=categories.find(c=>c.id===cat);const t=c&&c.tools.find(t=>t.name===name);return t?t.description:name;};
  const reqRowLabel=r=>r.selections? r.selections.map(s=>`${s.tools.map(t=>toolDesc(s.category,t)).join(', ')}`).join(' | ')
    : (r.categories? r.categories.map(c=>(categories.find(x=>x.id===c)||{}).display_name||c).join(', ') : ('backend: '+(r.backend||'—')));
  v.innerHTML=wrap(`
    <div class="card"><h2>Account</h2>
      <div class="row" style="margin-top:.6rem">
        <span class="pill ${statusPill}">${esc(a.status)}</span>
        <span class="pill">${esc(a.role)}</span><span class="pill">${esc(a.type)}</span>
        ${a.department?`<span class="pill">${esc(a.department)}</span>`:''}
        <span class="muted">${esc(a.full_name||a.name)} (${esc(a.name)})</span></div></div>
    <div class="card"><h2>Granted access</h2><p class="muted">What you can currently do${a.department?' (incl. via your department)':''}.</p>${accessHtml}</div>
    <div id="ra_denials"></div>
    <div class="card"><h2>Request more access</h2>
      <p class="muted">Open a category to pick the specific things you need — an admin reviews before anything is granted.</p>
      <div id="ra_cats" style="margin-top:.7rem"><p class="empty">Loading…</p></div>
      <label style="margin-top:.7rem">Why do you need this?<textarea id="ra_just" rows="2" placeholder="optional"></textarea></label>
      <div class="row" style="margin-top:.6rem"><button id="ra_send" ${a.status!=='active'?'disabled':''}>Request access</button></div>
      <div class="tbl-wrap" style="margin-top:1rem"><table><thead><tr><th>Requested</th><th>Status</th><th>Justification</th></tr></thead>
        <tbody>${myAccessReqs.map(r=>`<tr><td>${esc(reqRowLabel(r))}</td>
          <td><span class="pill ${r.status==='approved'?'ok':(r.status==='pending'?'pending':'warn')}">${esc(r.status)}</span></td>
          <td class="muted">${esc(r.justification||'—')}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">No requests yet.</td></tr>'}</tbody></table></div></div>
    <div class="card"><h2>API key</h2>
      <p class="muted">${a.has_key?'A key is issued.':'No key yet.'} Minting shows it once — store it safely; it replaces any previous key.</p>
      <div class="row"><button id="mintk" ${a.status!=='active'?'disabled':''}>${a.has_key?'Rotate key':'Mint key'}</button></div>
      <div id="keybox"></div></div>`);
  $('#mintk')?.addEventListener('click',async()=>{
    try{const r=await api('/dashboard/my-key/rotate',{method:'POST'});
      $('#keybox').innerHTML=`<div class="key">${esc(r.api_key)}</div>`;toast('Key minted — copy it now');
    }catch(e){toast(e.message,true);}});

  const box=$('#ra_cats');
  const sections=categories.map(c=>{
    const granted=grantedToolNames(c.backend), pending=pendingByBackend[c.backend]||new Set();
    const available=c.tools.filter(t=>!granted.has(t.name));
    if(!available.length) return '';
    return `<details class="ra-cat" data-cat="${esc(c.id)}" data-backend="${esc(c.backend)}" style="margin-top:.5rem;border:1px solid var(--gray200);border-radius:var(--radius-sm);padding:.5rem .7rem">
      <summary style="cursor:pointer;font-weight:600">${esc(c.display_name)} <span class="muted">(${available.length} available)</span></summary>
      <div style="margin-top:.6rem;display:flex;flex-direction:column;gap:.5rem">
        ${available.map(t=>`<label style="flex-direction:row;align-items:flex-start;gap:.5rem;font-weight:500;color:var(--text)">
          <input type="checkbox" class="ra-tool" value="${esc(t.name)}" style="width:auto;margin-top:.2rem" ${pending.has(t.name)?'disabled':''}>
          <span>${esc(t.description)}${pending.has(t.name)?' <span class="muted">(pending)</span>':''}</span>
        </label>`).join('')}
      </div></details>`;
  }).filter(Boolean).join('');
  box.innerHTML=sections || '<p class="empty">You already have every available tool.</p>';

  $('#ra_send')?.addEventListener('click',async()=>{
    const selections=[...document.querySelectorAll('#ra_cats details.ra-cat')].map(d=>({
      category:d.dataset.cat,
      tools:[...d.querySelectorAll('.ra-tool:checked')].map(i=>i.value),
    })).filter(s=>s.tools.length);
    if(!selections.length){toast('Pick at least one item',true);return;}
    try{
      await api('/dashboard/request-access',{method:'POST',
        body:JSON.stringify({selections,justification:$('#ra_just').value})});
      toast('Request submitted');
      paint('access');
    }catch(e){toast(e.message,true);}
  });

  // "Why was I denied?" -> one-click request, from this user's own denied attempts.
  try{
    const {denials}=await api('/dashboard/my-denials');
    if(denials&&denials.length){
      $('#ra_denials').innerHTML=`<div class="card"><h2>Recent denials</h2>
        <p class="muted">Calls blocked because you don't have the grant yet — request it in one click.</p>
        <div class="tbl-wrap" style="margin-top:.6rem"><table><thead><tr><th>What you tried to do</th><th>Attempts</th><th></th></tr></thead>
          <tbody>${denials.map((d,i)=>`<tr><td><div>${esc(d.description)}</div><div class="muted mono" style="font-size:.72rem">${esc(d.tool)}</div></td>
            <td class="num">${d.attempts}</td>
            <td style="text-align:right">${d.category?`<button class="sm" data-rq="${i}">Request access</button>`:'<span class="muted" style="font-size:.72rem">no category</span>'}</td></tr>`).join('')}</tbody></table></div></div>`;
      $('#ra_denials').querySelectorAll('button[data-rq]').forEach(b=>b.onclick=async()=>{
        const d=denials[Number(b.dataset.rq)];
        try{await api('/dashboard/request-access',{method:'POST',body:JSON.stringify({selections:[{category:d.category,tools:[d.canonical]}],justification:'Requested from a denied attempt'})});
          toast('Request submitted');paint('access');}catch(e){toast(e.message,true);}
      });
    }
  }catch(e){/* denials section is best-effort */}
}

function _fmtWhen(ts){return ts?new Date(ts*1000).toLocaleString():'—';}

// Loads ONLYOFFICE's DocsAPI script once per document-server origin (Document
// Server serves its own versioned api.js -- caching by src avoids re-injecting
// the same script tag on every artifact inspect).
const _ooApiLoads={};
function _loadOnlyofficeApi(base){
  const src=base+'/web-apps/apps/api/documents/api.js';
  if(window.DocsAPI && _ooApiLoads[src])return _ooApiLoads[src];
  _ooApiLoads[src]=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=()=>resolve(window.DocsAPI); s.onerror=()=>reject(new Error('Could not reach ONLYOFFICE Document Server at '+base));
    document.head.appendChild(s);
  });
  return _ooApiLoads[src];
}

    || '<tr><td colspan="5" class="empty">No conversations yet — ask the assistant something.</td></tr>';

    catch(err){ toast('Could not open that conversation: '+err.message, true); return; }
    $('#h_detail').innerHTML=`<div class="card"><h2>Conversation</h2>
      <p class="muted">${esc(sid)} · ${esc(t.status)}${t.summary?' · '+esc(t.summary):''}</p>

        ${t.messages.map(m=>`<div class="msg ${m.role==='user'?'me':'bot'}">${m.role==='user'?esc(m.content):mdToHtml(m.content)}</div>`).join('')}
      </div>
      <div class="row" style="margin-top:.8rem"><button id="h_continue">Continue this conversation</button></div></div>`;
    $('#h_detail').scrollIntoView({behavior:'smooth'});
    $('#h_continue').onclick=async()=>{
      try{
        // Open sessions resume under their own id; a closed one is cloned into a
        // fresh open session pre-seeded with these messages (server never
        // reopens a closed id -- see chat_log.resume_session).
        const r=await api('/dashboard/chat-history/'+encodeURIComponent(sid)+'/resume',{method:'POST'});
        setActiveConv(r.conversation_id);
        if(r.cloned) toast('Continuing as a new conversation (the old one stays closed)');
        go('assistant');
      }catch(e){toast(e.message,true);}
    };
  };
}

async function renderAlerts(v){
  v.innerHTML=wrap(`<div class="card">
      <div class="row" style="justify-content:space-between"><div><h2>Security incidents</h2>
        <p class="muted">Flagged behavior grouped per principal — enumeration, denial bursts, call bursts, repeated errors.</p></div>
        <div class="seg" id="al_filter"><button class="on" data-f="open">Open</button><button data-f="all">All</button></div></div>
      <div class="tbl-wrap" style="margin-top:.8rem"><table><thead><tr><th></th><th>Severity</th><th>Principal</th><th>Signal</th><th>Events</th><th>Last seen</th><th>Status</th><th></th></tr></thead>
        <tbody id="al_rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody></table></div></div>`);
  const sevColor={critical:'var(--error)',high:'var(--notify)',medium:'#b26a00',low:'var(--gray400)'};
  let showAll=false, cache=[];
  async function load(){
    const {alerts}=await api('/admin/alerts'); cache=alerts||[];
    const rows=cache.filter(a=>showAll||a.status==='open');
    $('#al_rows').innerHTML=rows.map(a=>`<tr class="arow" data-id="${esc(a.id)}" style="cursor:pointer">
        <td style="width:4px;padding:.3rem 0"><div class="sevbar" style="background:${sevColor[a.severity]||'var(--gray400)'}"></div></td>
        <td><span class="pill sev-${esc(a.severity)}">${esc(a.severity)}</span></td>
        <td><b>${esc(a.consumer)}</b></td>
        <td>${esc(a.reason)}</td>
        <td class="num">${a.events}</td>
        <td class="muted num">${_fmtWhen(a.last_ts)}</td>
        <td><span class="pill ${a.status==='open'?'warn':(a.status==='resolved'?'ok':'')}">${esc(a.status)}</span></td>
        <td class="row" style="flex-wrap:nowrap">${a.status!=='resolved'?`<button class="sm ghost" data-act="ack" data-id="${esc(a.id)}">Ack</button><button class="sm" data-act="resolve" data-id="${esc(a.id)}">Resolve</button>`:''}</td>
      </tr>`).join('')||`<tr><td colspan="8" class="empty">No ${showAll?'':'open '}incidents.</td></tr>`;
  }
  $('#al_filter').onclick=(e)=>{const b=e.target.closest('button');if(!b)return;showAll=b.dataset.f==='all';
    $('#al_filter').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));load();};
  $('#al_rows').onclick=async(e)=>{
    const btn=e.target.closest('button');
    if(btn){e.stopPropagation();
      try{await api(`/admin/alerts/${encodeURIComponent(btn.dataset.id)}/${btn.dataset.act}`,{method:'POST',body:'{}'});
        toast(btn.dataset.act==='ack'?'Acknowledged':'Resolved');load();}catch(err){toast(err.message,true);}return;}
    const tr=e.target.closest('.arow');if(!tr)return;
    const a=cache.find(x=>x.id===tr.dataset.id);if(!a)return;
    const f=(k,val)=>`<div><div class="k">${esc(k)}</div><div class="v">${esc(val==null?'—':val)}</div></div>`;
    openDrawer(`<div class="dh"><div style="flex:1"><div class="klbl">Incident · ${esc(a.severity)}</div>
        <h2 style="margin-top:.15rem">${esc(a.consumer)}</h2></div><button class="ghost sm" onclick="closeDrawer()">✕</button></div>
      <div class="db"><div class="err" style="min-height:auto">${esc(a.reason)}</div>
        <div class="kv">${f('Signal',a.type)}${f('Events',a.events)}${f('First seen',_fmtWhen(a.first_ts))}${f('Last seen',_fmtWhen(a.last_ts))}
          ${f('Status',a.status)}${f('Handled by',a.handled_by)}</div>
        <div><div class="klbl" style="margin-bottom:.3rem">Tools involved</div><div class="row">${(a.tools||[]).map(t=>`<span class="pill mono">${esc(t)}</span>`).join(' ')||'—'}</div></div>
        <div><div class="klbl" style="margin-bottom:.3rem">Contain</div>
          ${a.consumer_id?`<div class="row"><button class="danger" onclick="_contain('${esc(a.consumer_id)}','disable','${esc(a.id)}')">Disable principal</button>
            <button class="ghost" onclick="_contain('${esc(a.consumer_id)}','rotate','${esc(a.id)}')">Rotate key</button></div>
            <p class="muted" style="margin-top:.4rem;font-size:.72rem">Disable blocks this principal at the auth edge immediately; either action also resolves the incident.</p>`
            :'<p class="muted" style="font-size:.72rem">No linked account found for this principal — contain manually.</p>'}</div>
        ${a.status!=='resolved'?`<div class="row"><button class="ghost" onclick="_alertAct('${esc(a.id)}','ack')">Acknowledge</button><button onclick="_alertAct('${esc(a.id)}','resolve')">Resolve</button></div>`:''}</div>`);
  };
  window._alertAct=async(id,act)=>{try{await api(`/admin/alerts/${encodeURIComponent(id)}/${act}`,{method:'POST',body:'{}'});
    toast(act==='ack'?'Acknowledged':'Resolved');closeDrawer();load();}catch(e){toast(e.message,true);}};
  await load();
}

// ── Security: backend health + credential hygiene ──────────────────────────────
async function renderSecurity(v){
  v.innerHTML=wrap(`
    <div class="card card-pad" id="ctrl_card"><div class="row" style="justify-content:space-between"><div><h2>Break-glass controls</h2>
      <p class="muted" style="font-size:.82rem">Incident containment enforced on every governed call — takes effect immediately.</p></div>
      <span id="ctrl_state"></span></div>
      <div id="ctrl_body" style="margin-top:.8rem"><div class="empty">Loading…</div></div></div>
    <div class="card"><h2>Backend health</h2>
      <p class="muted">Live liveness probe per data-domain backend, combined with the recent-traffic error rate.</p>
      <div id="bh" class="grid" style="margin-top:.8rem"><div class="empty">Probing backends…</div></div></div>
    <div class="card"><h2>API-key hygiene</h2>
      <p class="muted">Dormant, never-used, or overdue-for-rotation keys — derived from call history and rotation audit events.</p>
      <div class="tbl-wrap" style="margin-top:.6rem"><table><thead><tr><th>Principal</th><th>Role</th><th>Last used</th><th>Key age</th><th>Flags</th></tr></thead>
        <tbody id="ch_rows"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody></table></div></div>`);
  const [ctrls,bh,ch]=await Promise.all([api('/admin/controls'),api('/admin/backends/health'),api('/admin/credential-hygiene')]);
  function drawControls(c){
    const paused=c.controls.paused_agents, pb=new Set(c.controls.paused_backends||[]);
    $('#ctrl_state').innerHTML=(paused||pb.size)?'<span class="pill warn">⚠ containment active</span>':'<span class="pill ok">normal</span>';
    $('#ctrl_body').innerHTML=`
      <label class="row" style="gap:.55rem;font-weight:600;color:var(--text)"><input type="checkbox" id="ctrl_agents" ${paused?'checked':''} style="width:auto"> Pause all agents (API-key callers) — humans/admins unaffected</label>
      <div style="margin-top:.8rem"><div class="klbl" style="margin-bottom:.45rem">Pause specific backends</div>
        <div class="row" style="gap:.9rem">${(c.backends||[]).map(b=>`<label class="row" style="gap:.35rem;font-weight:500"><input type="checkbox" class="ctrl_be" value="${esc(b)}" ${pb.has(b)?'checked':''} style="width:auto"><span class="mono" style="font-size:.78rem">${esc(b)}</span></label>`).join('')}</div></div>
      <div class="row" style="margin-top:.9rem"><button id="ctrl_save">Apply controls</button></div>`;
    $('#ctrl_save').onclick=async()=>{
      const body={paused_agents:$('#ctrl_agents').checked,paused_backends:[...document.querySelectorAll('.ctrl_be:checked')].map(x=>x.value)};
      try{const r=await api('/admin/controls',{method:'PUT',body:JSON.stringify(body)});drawControls({controls:r.controls,backends:c.backends});toast('Controls applied');}
      catch(e){toast(e.message,true);}
    };
  }
  drawControls(ctrls);
  const stPill={healthy:'ok',degraded:'pending',down:'warn',idle:''}, stMark={healthy:'● ',degraded:'▲ ',down:'✕ ',idle:'○ '};
  $('#bh').innerHTML=(bh.backends||[]).map(b=>`<div class="card" style="margin:0">
      <div class="row" style="justify-content:space-between"><b>${esc(b.backend)}</b><span class="pill ${stPill[b.status]||''}">${stMark[b.status]||''}${esc(b.status)}</span></div>
      <div class="muted" style="margin-top:.4rem;font-size:.78rem">
        ${b.probe_ok===false?`<span style="color:var(--error)">probe failed: ${esc(b.probe_error||'unreachable')}</span>`
          :(b.probe_latency_ms!=null?`probe ${b.probe_latency_ms}ms`:'not probed')}<br>
        ${b.calls} calls · ${(b.error_rate*100).toFixed(0)}% errors · last ok ${b.last_ok?_fmtWhen(b.last_ok):'—'}</div></div>`).join('')
    || '<div class="empty">No backends.</div>';
  $('#ch_rows').innerHTML=(ch.consumers||[]).map(c=>`<tr>
      <td><b>${esc(c.name)}</b></td><td>${esc(c.role)}</td>
      <td class="muted num">${c.last_used?_fmtWhen(c.last_used):'never'}</td>
      <td class="num">${c.key_age_days!=null?c.key_age_days+'d':'—'}</td>
      <td>${c.flags.length?c.flags.map(f=>`<span class="pill warn">${esc(f)}</span>`).join(' '):'<span class="pill ok">ok</span>'}</td></tr>`).join('')
    || '<tr><td colspan="5" class="empty">No API-key consumers.</td></tr>';
}

// ── Consumer risk profile (drawer) ─────────────────────────────────────────────
async function openProfile(cid){
  openDrawer('<div class="db"><p class="empty">Loading…</p></div>');
  try{
    const p=await api('/admin/consumers/'+encodeURIComponent(cid)+'/profile'); const t=p.totals;
    const f=(k,val)=>`<div><div class="k">${esc(k)}</div><div class="v">${esc(val==null?'—':val)}</div></div>`;
    const unused=p.unused_grants||[];
    const keyAge=p.last_key_rotation?Math.round((Date.now()/1000-p.last_key_rotation)/86400)+'d':'unknown';
    openDrawer(`<div class="dh"><div style="flex:1"><div class="klbl">Risk profile</div>
        <h2 style="margin-top:.15rem">${esc(p.full_name||p.name)}</h2>
        <div class="muted mono" style="font-size:.78rem">${esc(p.name)}${p.department?' · '+esc(p.department):''}</div></div>
        <button class="ghost sm" onclick="closeDrawer()">✕</button></div>
      <div class="db">
        <div class="row">${(p.reasons&&p.reasons.length)?`<span class="pill warn">⚠ ${p.reasons.length} active flag(s)</span>`:'<span class="pill ok">✓ no active flags</span>'}
          <span class="pill">${esc(p.role)}</span><span class="pill">${esc(p.type)}</span><span class="pill ${p.status==='active'?'ok':'pending'}">${esc(p.status)}</span></div>
        ${(p.reasons&&p.reasons.length)?`<div class="err" style="min-height:auto">${p.reasons.map(esc).join('<br>')}</div>`:''}
        <div class="kv">
          ${f('Calls (total)',t.total)}${f('Last 24h / 7d',t.last_24h+' / '+t.last_7d)}
          ${f('Denied',t.denied)}${f('Errors',t.error)}
          ${f('Distinct customers',p.distinct_customers)}${f('Rows returned',p.rows_returned)}
          ${f('Sensitive-tool calls',p.sensitive_calls)}${f('Redactions applied',p.redactions)}
          ${f('Rate limit / hr',p.rate_limit_per_hour)}${f('Last used',p.last_used?_fmtWhen(p.last_used):'never')}
          ${f('Key age',keyAge)}${f('Source IPs',(p.ips||[]).length)}
        </div>
        <div><div class="klbl" style="margin-bottom:.35rem">Least privilege — granted but never used (${unused.length})</div>
          ${unused.length?`<div class="row">${unused.slice(0,24).map(u=>`<span class="pill mono">${esc(u)}</span>`).join(' ')}</div><p class="muted" style="margin-top:.5rem">Candidates to revoke.</p>`
            :'<p class="muted">Every granted tool has been used — no obvious over-provisioning.</p>'}</div>
        ${(p.ips||[]).length?`<div><div class="klbl" style="margin-bottom:.35rem">Source IPs</div><div class="row">${p.ips.map(i=>`<span class="pill mono">${esc(i)}</span>`).join(' ')}</div></div>`:''}
      </div>`);
  }catch(e){openDrawer(`<div class="dh"><div class="klbl">Risk profile</div><button class="ghost sm" onclick="closeDrawer()">✕</button></div><div class="db"><p class="err">${esc(e.message)}</p></div>`);}
}

// ── one-click containment (from an alert) ──────────────────────────────────────
async function _contain(cid,action,alertId){
  const msg=action==='disable'
    ? 'Disable this principal? It will be blocked at the auth edge immediately.'
    : "Rotate this principal's key? Its current key stops working at once.";
  if(!confirm(msg))return;
  try{
    if(action==='disable') await api('/admin/consumers/'+encodeURIComponent(cid),{method:'PATCH',body:JSON.stringify({status:'disabled'})});
    else await api('/admin/consumers/'+encodeURIComponent(cid)+'/rotate-key',{method:'POST'});
    await api('/admin/alerts/'+encodeURIComponent(alertId)+'/resolve',{method:'POST',body:'{}'}).catch(()=>{});
    toast(action==='disable'?'Principal disabled · incident resolved':'Key rotated · incident resolved');
    closeDrawer(); paint('alerts');
  }catch(e){toast(e.message,true);}
}

      <div id="wf_preflight" style="margin-top:.7rem"></div>
      <div id="wf_out" style="margin-top:.8rem"></div></div>
    <div class="card"><h2>Recent workflow runs</h2><div class="tbl-wrap" style="margin-top:.6rem"><table><thead><tr><th>Run</th><th>Template</th><th>Status</th><th>Artifacts</th><th>Approvals</th><th></th></tr></thead><tbody id="wf_runs"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody></table></div></div>`);
  async function loadHealth(){
    if(ME.role!=='admin')return;
    try{
      const h=await api('/admin/workflow-health');
      const cls=h.health==='healthy'?'ok':(h.health==='unhealthy'?'warn':'pending');
      const rows=(h.templates||[]).map(t=>`<tr><td><b>${esc(t.displayName)}</b><div class="muted mono" style="font-size:.72rem">${esc(t.templateId)}</div></td><td><span class="pill ${t.lastStatus==='completed'?'ok':(t.lastStatus==='failed'?'warn':'pending')}">${esc(t.lastStatus)}</span></td><td class="num muted">${esc(t.runs)}</td><td class="num muted">${esc(t.failureRate)}%</td><td class="num muted">${esc(t.artifactRate)}</td><td class="num muted">${esc(t.avgDurationSec)}s</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No workflow templates.</td></tr>';
      $('#wf_health').innerHTML=`<div class="card" style="margin:.8rem 0 0"><div class="row" style="justify-content:space-between"><div><h3>Workflow health</h3><p class="muted" style="font-size:.78rem">Run quality is derived from persisted workflow runs.</p></div><span class="pill ${cls}">${esc(h.health)}</span></div><div class="kpis" style="margin-top:.7rem"><div class="kpi"><div class="lab">Runs</div><div class="val">${esc(h.totalRuns)}</div></div><div class="kpi ${h.failedRuns?'alert':''}"><div class="lab">Failed</div><div class="val">${esc(h.failedRuns)}</div></div><div class="kpi"><div class="lab">Approval gate</div><div class="val">${esc(h.approvalRate)}<small>%</small></div></div><div class="kpi ${h.stuckRuns&&h.stuckRuns.length?'alert':''}"><div class="lab">Stuck</div><div class="val">${esc((h.stuckRuns||[]).length)}</div></div></div><div class="tbl-wrap" style="margin-top:.7rem"><table><thead><tr><th>Template</th><th>Last</th><th>Runs</th><th>Fail</th><th>Artifacts/run</th><th>Avg</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;

  function workflowInputBody(){

    }catch(e){box.innerHTML=`<p class="err">${esc(e.message)}</p>`;}
  }
  $('#wf_cards').innerHTML=workflows.map(w=>{
    const active=w.status==='active';
    const adminToggle=ME.role==='admin'?`<button class="sm ${active?'danger':'ghost'}" data-wf-toggle="${esc(w.templateId)}" data-action="${active?'disable':'enable'}">${active?'Disable':'Enable'}</button>`:'';
    const reason=!active&&w.disabledReason?`<div class="muted" style="font-size:.72rem;margin-top:.35rem">Reason: ${esc(w.disabledReason)}</div>`:'';
    return `<div class="card" style="margin:0"><div class="row" style="justify-content:space-between"><b>${esc(w.displayName)}</b><span class="pill ${active?'ok':'pending'}">${esc(w.status)}</span></div><p class="muted" style="font-size:.8rem;margin:.45rem 0">${esc(w.description)}</p><div class="row">${(w.requiredCategories||[]).map(c=>`<span class="pill">${esc(c)}</span>`).join('')}</div><div class="muted" style="font-size:.72rem;margin-top:.45rem">Outputs: ${(w.outputTypes||[]).map(esc).join(', ')}</div>${reason}<div class="row" style="margin-top:.6rem"><button class="sm ghost" data-wf="${esc(w.templateId)}" ${active?'':'disabled'}>Select</button>${adminToggle}</div></div>`;
  }).join('')||'<p class="empty">No workflows.</p>';
  async function loadRuns(){
    const runs=await api('/workflow-runs');
    $('#wf_runs').innerHTML=(runs.runs||[]).map(r=>{
      const cls=r.status==='completed'?'ok':(r.status==='failed'||r.status==='cancelled'?'warn':'pending');

  await loadHealth();

  $('#wf_cards').onclick=async(e)=>{
    const toggle=e.target.closest('[data-wf-toggle]');

      await loadRuns();
