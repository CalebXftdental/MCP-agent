<!doctype html>
<html><head><meta charset="utf-8"><title>Governance — My Access</title>
<style>
 :root{font-family:system-ui,sans-serif}
 body{max-width:44rem;margin:2rem auto;padding:0 1rem;color:#1a1a1a}
 header{display:flex;align-items:center;gap:1rem}
 header h1{font-size:1.1rem;margin:0} .sp{margin-left:auto}
 .card{border:1px solid #d9deea;border-radius:8px;padding:1rem;margin:1rem 0}
 .pending{background:#fff3cd;border-color:#e0c97a}
 .key{background:#fff3cd;border:1px solid #e0c97a;padding:.5rem;border-radius:6px;font-family:ui-monospace,monospace;word-break:break-all}
 .pill{background:#eef;border-radius:10px;padding:.05rem .45rem;font-size:.75rem;margin:.1rem}
 button{padding:.4rem .8rem;cursor:pointer} input,select,textarea{font:inherit;padding:.35rem;box-sizing:border-box}
 table{border-collapse:collapse;width:100%;font-size:.85rem} td,th{border-bottom:1px solid #eee;padding:.3rem;text-align:left}
 .muted{color:#889;font-size:.85rem} #err{color:#b00020} a.btn{text-decoration:none}
</style></head>
<body>
<header><h1>⚖️ My Access</h1>
  <span class="sp"></span><span id="who" class="muted"></span>
  <a id="adminlink" class="btn" href="/dashboard/admin" style="display:none">Admin →</a>
  <button onclick="logout()">Sign out</button>
</header>
<p id="err"></p>
<div id="status_card" class="card"></div>

<div id="active_area" style="display:none">
  <div class="card"><h3>API key</h3>
    <p class="muted">Your key is shown once. Generate or rotate it here; only its hash is stored.</p>
    <button onclick="rotateKey()">Generate / rotate key</button>
    <div id="key_out"></div>
  </div>
  <div class="card"><h3>What I can access</h3><div id="access"></div></div>
  <div class="card"><h3>Request more access</h3>
    <p><label>Backend <input id="r_backend" value="minierp"></label></p>
    <p><label>Tools (comma-separated) <input id="r_tools" size="40" placeholder="get_customer_order_total"></label></p>
    <p><label>Levels <input id="r_levels" placeholder="SENSITIVE"></label></p>
    <p><label>Why <input id="r_why" size="50"></label></p>
    <button onclick="requestAccess()">Submit request</button>
  </div>
</div>

<div class="card"><h3>My requests</h3><table id="reqs"><tbody></tbody></table></div>

<script>
const $=s=>document.querySelector(s);
function err(m){$('#err').textContent=m||''}
async function api(p,o){const r=await fetch(p,Object.assign({headers:{'content-type':'application/json'}},o||{}));
 if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||('HTTP '+r.status))}return r.json()}
async function logout(){await fetch('/dashboard/logout',{method:'POST'});location='/dashboard'}
async function load(){
 try{
  const m=await api('/dashboard/my-access');
  $('#who').textContent=m.name+' · '+m.role+((m.categories&&m.categories.length)?(' · '+m.categories.join(', ')):'');
  if(m.role==='admin')$('#adminlink').style.display='';
  if(m.status!=='active'){
    $('#status_card').className='card pending';
    $('#status_card').innerHTML=`<b>Status: ${m.status}</b><br><span class="muted">Your account is awaiting admin approval. You'll be able to generate a key once approved.</span>`;
  } else {
    $('#status_card').innerHTML=`<b>Status: active</b> — categories <b>${(m.categories||[]).join(', ')||'(none)'}</b>. Key issued: ${m.has_key?'yes':'not yet'}.`;
    $('#active_area').style.display='';
    $('#access').innerHTML=Object.entries(m.access).map(([b,g])=>
      `<p><b>${b}</b>: ${(g.tools||[]).map(t=>`<span class="pill">${t}</span>`).join('')||'<span class=muted>none</span>'}<br>
       <span class="muted">levels: ${(g.levels||[]).join(', ')||'none'}</span></p>`).join('')||'<span class=muted>no access</span>';
  }
  $('#reqs').innerHTML='<tr><th>kind</th><th>detail</th><th>status</th></tr>'+(m.requests||[]).map(r=>
    `<tr><td>${r.kind}</td><td class=muted>${r.kind==='account'?((r.categories||[]).join(', ')):((r.tools||[]).join(', '))} ${r.justification||''}</td><td>${r.status}</td></tr>`).join('');
 }catch(e){err(e.message)}
}
async function rotateKey(){try{const r=await api('/dashboard/my-key/rotate',{method:'POST'});
 $('#key_out').innerHTML=`<p>Your new key (copy it now):</p><div class="key">${r.api_key}</div>`;await load()}catch(e){err(e.message)}}
async function requestAccess(){err('');try{
 const body={backend:$('#r_backend').value.trim(),
  tools:$('#r_tools').value.split(',').map(s=>s.trim()).filter(Boolean),
  levels:$('#r_levels').value.split(',').map(s=>s.trim()).filter(Boolean),
  justification:$('#r_why').value};
 await api('/dashboard/request-access',{method:'POST',body:JSON.stringify(body)});
 $('#r_tools').value='';$('#r_why').value='';await load();
}catch(e){err(e.message)}}
load();
</script>
</body></html>
