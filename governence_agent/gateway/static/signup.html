<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1"><title>Frontier Governance — Create account</title>
<style>
:root{--highlight:#2FC7BA;--highlight-darker:#2ab3a7;--gray900:#212121;--gray700:#A1A1A1;
--gray200:#E7E7E7;--gray50:#F6F7F8;--error:#f44336}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
background:linear-gradient(135deg,#eafaf8,var(--gray50));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--gray900)}
.card{background:#fff;border:1px solid var(--gray200);border-radius:16px;padding:2rem 1.9rem;width:24rem;
box-shadow:0 10px 40px -12px rgba(33,33,33,.22)}
.logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--highlight),#5ad6cb);
display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.4rem;margin-bottom:1rem}
h2{margin:0 0 .15rem;font-size:1.25rem}p.sub{margin:0 0 1.4rem;color:var(--gray700);font-size:.85rem}
label{display:block;font-size:.78rem;font-weight:600;color:var(--gray700);margin:.7rem 0 .25rem}
input,select{width:100%;padding:.6rem .7rem;border:1px solid var(--gray200);border-radius:9px;font:inherit;background:#fff;color:inherit}
input:focus,select:focus{outline:2px solid var(--highlight);border-color:transparent}
button{width:100%;margin-top:1.2rem;padding:.65rem;border:0;border-radius:9px;background:var(--highlight);
color:#fff;font-weight:650;font-size:.95rem;cursor:pointer}button:hover{background:var(--highlight-darker)}
button:disabled{opacity:.6;cursor:default}
#e{color:var(--error);font-size:.83rem;min-height:1.1rem;margin:.6rem 0 0;text-align:center}
.foot{margin:1rem 0 0;text-align:center;font-size:.82rem;color:var(--gray700)}
.foot a{color:var(--highlight);text-decoration:none;font-weight:600}
</style></head><body>
<form class=card id=f>
<div class=logo>F</div>
<h2>Create your account</h2><p class=sub>Pick your department — we set your default access from it.</p>
<label for=fn>Full name</label><input id=fn autofocus autocomplete=name>
<label for=u>Username</label><input id=u autocomplete=username>
<label for=dept>Department</label><select id=dept><option value="">Loading…</option></select>
<label for=p>Password</label><input id=p type=password autocomplete=new-password>
<label for=p2>Confirm password</label><input id=p2 type=password autocomplete=new-password>
<button id=go>Create account</button><p id=e></p>
<p class=foot>Already have an account? <a href=/dashboard>Sign in</a></p>
</form>
<script>
(async()=>{
  try{
    const r=await fetch('/dashboard/departments');
    const j=await r.json();
    dept.innerHTML='<option value="">Select a department…</option>'+
      j.departments.map(d=>`<option value="${d.id}">${d.display_name}</option>`).join('');
  }catch(err){dept.innerHTML='<option value="">(unavailable — try reloading)</option>';}
})();
f.onsubmit=async e=>{
  e.preventDefault();
  const err=document.getElementById('e');
  err.textContent='';
  if(!fn.value.trim()||!u.value.trim()||!p.value){err.textContent='All fields are required';return;}
  if(!dept.value){err.textContent='Choose a department';return;}
  if(p.value!==p2.value){err.textContent='Passwords do not match';return;}
  go.disabled=true;
  try{
    const r=await fetch('/dashboard/signup',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({full_name:fn.value.trim(),username:u.value.trim(),password:p.value,department:dept.value})});
    if(r.ok){location='/dashboard';return;}
    const j=await r.json().catch(()=>({}));
    err.textContent=j.error||'Sign up failed';
  }finally{go.disabled=false;}
}
</script>
</body></html>
