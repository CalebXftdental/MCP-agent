}

// ── My Workflow: hand-rolled drag/dot-connect graph builder (no external library,
// consistent with this app having zero third-party JS dependencies anywhere else).
// State is kept as plain {nodes, edges} matching the backend's GraphNode/GraphEdge
// shape directly -- `edges` is never hand-edited, it's DERIVED from every node's
// inputBindings at save/validate/redraw time, so there is exactly one source of
// truth (a binding) for "what's connected to what," never two structures to keep
// in sync. ──
let MW = null;

function mwNodeId(){return 'n_'+Math.random().toString(36).slice(2,9);}
function mwEdgeId(){return 'e_'+Math.random().toString(36).slice(2,9);}

function mwBlankState(){
  return {graphId:'', displayName:'Untitled workflow', description:'', status:'draft', publishedVersion:0,
    nodes:[{nodeId:'t1', kind:'trigger', title:'Trigger', config:{mode:'manual'}, inputBindings:{}, position:{x:30,y:40}}],
    selected:'t1', catalog:[], catalogByTool:{}};
}

// One derived edge per (targetNode, argName) binding whose source is another
// node -- this is what gets POSTed to the server and what the cycle-check walks.
function mwDerivedEdges(nodes){
  const edges=[]; const trigger=nodes.find(x=>x.kind==='trigger');
  for(const n of nodes){
    if(n.kind==='trigger')continue;
    const nodeBindings=Object.values(n.inputBindings||{}).filter(b=>b && b.source==='node' && b.node_id);
    if(nodeBindings.length){
      nodeBindings.forEach(b=>edges.push({edgeId:mwEdgeId(),sourceNodeId:b.node_id,targetNodeId:n.nodeId}));
    }else if(trigger){
      // No data dependency on another step (every arg is literal or trigger-bound) --
      // still needs to be connected/ordered in the graph, or it looks like an
      // unreachable orphan to both this halo check and the server's validate_graph.
      // Implicitly treat it as running right after the trigger.
      edges.push({edgeId:mwEdgeId(),sourceNodeId:trigger.nodeId,targetNodeId:n.nodeId});
    }
  }
  return edges;
}

function mwWouldCreateCycle(fromId,toId){
  // Would adding an edge fromId -> toId create a cycle? True iff toId can already reach fromId.
  if(fromId===toId) return true;
  const edges=mwDerivedEdges(MW.nodes);
  const out={}; edges.forEach(e=>{(out[e.sourceNodeId]=out[e.sourceNodeId]||[]).push(e.targetNodeId);});
  const seen=new Set([toId]); const queue=[toId];
  while(queue.length){const cur=queue.pop(); for(const nxt of (out[cur]||[])){if(nxt===fromId)return true; if(!seen.has(nxt)){seen.add(nxt);queue.push(nxt);}}}
  return false;
}

function mwNodeById(id){return (MW.nodes||[]).find(n=>n.nodeId===id);}

function mwNodeLabel(n){
  if(n.kind==='trigger')return 'Trigger';
  if(n.kind==='approval_gate')return n.title||'Approval gate';
  if(n.kind==='llm_transform')return n.title||('AI: '+(n.config.kind||'summarize'));
  const meta=MW.catalogByTool[n.tool];
  return n.title||(meta?meta.description.split('.')[0].split(' -- ')[0].slice(0,40):n.tool);
}

function mwInputSlotsFor(n){
  if(n.kind==='tool_call'){
    const meta=MW.catalogByTool[n.tool];
    const props=(meta&&meta.parameters&&meta.parameters.properties)||{};
    return Object.keys(props).filter(k=>k!=='owner').map(k=>({name:k,label:k}));
  }
  if(n.kind==='llm_transform')return [{name:'input_text',label:'Input text'}];
  return [];
}

function mwOutputPinsFor(n){
  if(n.kind==='tool_call'){const meta=MW.catalogByTool[n.tool];return (meta&&meta.outputFields)||[];}
  if(n.kind==='approval_gate')return ['approvalId'];
  if(n.kind==='llm_transform')return ['text'];
  return [];
}

function mwRiskPill(n){
  if(n.kind!=='tool_call')return '';
  const meta=MW.catalogByTool[n.tool]; if(!meta||!meta.riskLevel)return '';
  const cls=meta.riskLevel==='send'?'warn':(meta.riskLevel==='export'?'pending':(meta.riskLevel==='read_sensitive'?'':'ok'));
  return `<span class="pill ${cls}">${esc(meta.riskLevel)}</span>`;
}

// Cosmetic-only, simplified approximation of the server's real mandatory-gate-
// before-send rule (governance_core/workflow_graph_store.py validate_graph) --
// never trusted as the real check; Validate/Save always re-confirms server-side.
function mwSendRiskNeedsGateHalo(n){
  if(n.kind!=='tool_call')return false;
  const meta=MW.catalogByTool[n.tool]; if(!meta||meta.riskLevel!=='send')return false;
  const trigger=MW.nodes.find(x=>x.kind==='trigger'); if(!trigger)return true;
  const withoutGates=new Set(MW.nodes.filter(x=>x.kind==='approval_gate').map(x=>x.nodeId));
  // Reachable-from-trigger, walking forward, but never expanding PAST a gate node
  // (the gate itself is still reachable -- just nothing downstream of it, via this
  // path -- mirroring the server's "remove every gate node, recheck reachability" rule).
  const fwd={}; mwDerivedEdges(MW.nodes).forEach(e=>{(fwd[e.sourceNodeId]=fwd[e.sourceNodeId]||[]).push(e.targetNodeId);});
  const reach=new Set(); const q=[trigger.nodeId];
  while(q.length){const cur=q.pop(); if(withoutGates.has(cur)&&cur!==trigger.nodeId)continue; for(const nxt of (fwd[cur]||[])){if(!reach.has(nxt)){reach.add(nxt);if(!withoutGates.has(nxt))q.push(nxt);}}}
  return reach.has(n.nodeId);
}

async function renderMyWorkflows(v){
  v.innerHTML=`<div class="content" style="max-width:none">
    <div class="card"><div class="row" style="justify-content:space-between;align-items:center">
      <div><h2>My Workflow</h2><p class="muted">Drag governed tools onto the canvas, connect their outputs to the next step's inputs, and add an approval gate before anything that sends or exports. No code required.</p></div>
      <div class="row">
        <select id="mw_select" style="min-width:180px"></select>
        <button class="ghost sm" id="mw_new">New</button>
        <button class="ghost sm" id="mw_validate">Validate</button>
        <button class="ghost sm" id="mw_save">Save</button>
        <button class="sm" id="mw_publish">Publish</button>
        <button id="mw_run">Run</button>
      </div></div>
      <div id="mw_meta" class="row" style="margin-top:.6rem"></div>
    </div>
    <div style="display:grid;grid-template-columns:230px 1fr 300px;gap:.75rem;height:66vh">
      <div class="card" id="mw_palette" style="overflow-y:auto"><p class="muted">Loading tools...</p></div>
      <div class="card wf-canvas-wrap" id="mw_canvas_wrap">
        <svg class="wf-edges" id="mw_edges"></svg>
        <div class="wf-canvas" id="mw_canvas" style="width:1400px;height:900px"></div>
      </div>
      <div class="card" id="mw_props" style="overflow-y:auto"><p class="muted">Select a node to edit it, or drag one in from the palette on the left.</p></div>
    </div>
    <div id="mw_validate_box" style="margin-top:.75rem"></div>
    <div id="mw_run_box" style="margin-top:.75rem"></div>
  </div>`;

  MW = mwBlankState();

  try{
    const cat=await api('/dashboard/workflow-graph-catalog');
    MW.catalog=cat.tools||[];
    MW.catalogByTool={}; MW.catalog.forEach(t=>{MW.catalogByTool[t.canonical]=t;});
  }catch(e){$('#mw_palette').innerHTML=`<p class="err">${esc(e.message)}</p>`;}

  async function loadGraphList(){
    const list=await api('/workflow-graphs');
    const graphs=list.graphs||[];
    $('#mw_select').innerHTML='<option value="">-- new workflow --</option>'+graphs.map(g=>`<option value="${esc(g.graphId)}">${esc(g.displayName)} (${esc(g.status)})</option>`).join('');
    return graphs;
  }

  function paintMeta(){
    $('#mw_meta').innerHTML=`<input id="mw_name" value="${esc(MW.displayName)}" style="max-width:260px" placeholder="Workflow name">
      <span class="pill ${MW.status==='active'?'ok':(MW.status==='disabled'?'warn':'pending')}">${esc(MW.status)}</span>
      ${MW.publishedVersion?`<span class="muted" style="font-size:.76rem">published v${esc(MW.publishedVersion)}</span>`:'<span class="muted" style="font-size:.76rem">never published</span>'}`;
    $('#mw_name').onchange=()=>{MW.displayName=$('#mw_name').value.trim()||'Untitled workflow';};
  }

  function paintPalette(){
    const byBackend={};
    MW.catalog.forEach(t=>{(byBackend[t.backend||'other']=byBackend[t.backend||'other']||[]).push(t);});
    let html='<div class="wf-pal-group">Flow control</div>'
      +`<div class="wf-pal-item" draggable="true" data-kind="approval_gate"><div class="t">Approval gate</div><div class="d">Pause and require sign-off before continuing.</div></div>`
      +`<div class="wf-pal-item" draggable="true" data-kind="llm_transform"><div class="t">AI step</div><div class="d">Summarize, draft, classify, or extract from an earlier step's output.</div></div>`;
    for(const backend of Object.keys(byBackend).sort()){
      html+=`<div class="wf-pal-group">${esc(backend)}</div>`;
      html+=byBackend[backend].map(t=>`<div class="wf-pal-item ${t.granted?'':'locked'}" draggable="${t.granted}" data-kind="tool_call" data-tool="${esc(t.canonical)}" title="${t.granted?'':'You do not have access to this tool'}">
        <div class="t">${esc(t.canonical)}${t.riskLevel?`<span class="pill" style="font-size:.62rem">${esc(t.riskLevel)}</span>`:''}</div>
        <div class="d">${esc(t.description)}</div></div>`).join('');
    }
    $('#mw_palette').innerHTML=html;
  }

  function paintCanvas(){
    const canvas=$('#mw_canvas');
    canvas.innerHTML=MW.nodes.map(n=>{
      const inputs=mwInputSlotsFor(n), outputs=mwOutputPinsFor(n);
      const rows=Math.max(inputs.length,outputs.length,1);
      const halo=mwSendRiskNeedsGateHalo(n);
      return `<div class="wf-node ${n.nodeId===MW.selected?'selected':''} ${halo?'needs-gate':''}" data-node-id="${esc(n.nodeId)}"
          style="left:${n.position.x||0}px;top:${n.position.y||0}px;min-height:${52+rows*16}px">
        <div class="hd"><span>${esc(mwNodeLabel(n))}</span><span class="row" style="gap:.3rem">${mwRiskPill(n)}${n.kind==='trigger'?'':`<button class="wf-node-del" data-del="${esc(n.nodeId)}" title="Delete node">&times;</button>`}</span></div>
        <div class="bd">${esc(n.kind==='tool_call'?n.tool:n.kind)}${halo?'<div class="err" style="font-size:.68rem;margin-top:.2rem">needs an approval gate before this</div>':''}</div>
        ${inputs.map((s,i)=>`<div class="wf-port in" data-node="${esc(n.nodeId)}" data-pin="${esc(s.name)}" data-dir="in" style="top:${46+i*16}px" title="in: ${esc(s.label)}"></div>`).join('')}
        ${outputs.map((name,i)=>`<div class="wf-port out" data-node="${esc(n.nodeId)}" data-pin="${esc(name)}" data-dir="out" style="top:${46+i*16}px" title="out: ${esc(name)}"></div>`).join('')}
      </div>`;
    }).join('');
    mwRedrawEdges();
  }

  function mwPortEl(nodeId,pin,dir){return canvasQuerySafe(`.wf-port.${dir}[data-node="${cssEsc(nodeId)}"][data-pin="${cssEsc(pin)}"]`);}
  function canvasQuerySafe(sel){try{return $('#mw_canvas').querySelector(sel);}catch(e){return null;}}
  function cssEsc(s){return String(s).replace(/["\\]/g,'\\$&');}

  function mwRedrawEdges(){
    const svg=$('#mw_edges'); const wrapEl=$('#mw_canvas_wrap'); const wrapRect=wrapEl.getBoundingClientRect();
    const canvas=$('#mw_canvas');
    svg.setAttribute('width',canvas.style.width); svg.setAttribute('height',canvas.style.height);
    const segs=[];
    MW.nodes.forEach(n=>{
      Object.entries(n.inputBindings||{}).forEach(([arg,b])=>{
        if(!b||b.source!=='node')return;
        const srcEl=mwPortEl(b.node_id,b.path,'out'); const dstEl=mwPortEl(n.nodeId,arg,'in');
        if(!srcEl||!dstEl)return;
        const sr=srcEl.getBoundingClientRect(), dr=dstEl.getBoundingClientRect();
        const x1=sr.left-wrapRect.left+wrapEl.scrollLeft+5, y1=sr.top-wrapRect.top+wrapEl.scrollTop+5;
        const x2=dr.left-wrapRect.left+wrapEl.scrollLeft+5, y2=dr.top-wrapRect.top+wrapEl.scrollTop+5;
        const dx=Math.max(40,Math.abs(x2-x1)/2);
        segs.push(`<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" stroke="var(--highlight-darker)" stroke-width="2" fill="none"/>`);
      });
    });
    svg.innerHTML=segs.join('');
  }

  function paintProps(){
    const box=$('#mw_props'); const n=mwNodeById(MW.selected);
    if(!n){box.innerHTML='<p class="muted">Select a node to edit it.</p>';return;}
    let html=`<div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">${esc(mwNodeLabel(n))}</h3></div>`;
    if(n.kind==='trigger'){
      html+='<p class="muted" style="font-size:.78rem">Runs manually, or on a schedule via the Automations tab once published. Values used by downstream steps come from each step\'s own config, or type a JSON body when you click Run.</p>';
    } else if(n.kind==='approval_gate'){
      html+=mwFieldLiteral(n,'reason','Reason for review','textarea')+mwFieldLiteral(n,'risk_level','Risk level','select',['medium','high']);
    } else if(n.kind==='llm_transform'){
      html+=mwFieldLiteral(n,'kind','AI action','select',['summarize','draft_reply','classify','extract']);
      html+=mwFieldLiteral(n,'instruction','Instruction','textarea');
      html+=mwFieldBinding(n,'input_text','Input text (from an earlier step)');
    } else if(n.kind==='tool_call'){
      const meta=MW.catalogByTool[n.tool]||{};
      if(!meta.granted)html+='<p class="err" style="font-size:.78rem">You do not currently have access to this tool -- saving will fail until an admin grants it, or you remove this step.</p>';
      mwInputSlotsFor(n).forEach(s=>{html+=mwFieldBinding(n,s.name,s.label);});
      if((meta.outputFields||[]).length)html+=`<p class="muted" style="font-size:.72rem;margin-top:.4rem">Outputs available to later steps: ${meta.outputFields.map(esc).join(', ')}</p>`;
    }
    box.innerHTML=html;
  }

  function mwFieldLiteral(n,key,label,kind,options){
    const val=(n.config||{})[key]||'';
    if(kind==='select')return `<div class="wf-prop-row"><label>${esc(label)}</label><select data-cfg="${esc(key)}">${(options||[]).map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
    if(kind==='textarea')return `<div class="wf-prop-row"><label>${esc(label)}</label><textarea data-cfg="${esc(key)}" rows="3">${esc(val)}</textarea></div>`;
    return `<div class="wf-prop-row"><label>${esc(label)}</label><input data-cfg="${esc(key)}" value="${esc(val)}"></div>`;
  }

  function mwFieldBinding(n,arg,label){
    const b=(n.inputBindings||{})[arg];
    if(b){
      const desc=b.source==='node'?`${mwNodeById(b.node_id)?mwNodeLabel(mwNodeById(b.node_id)):b.node_id} -> ${b.path}`:(b.source==='trigger'?`trigger: ${b.path}`:`literal: ${b.value}`);
      return `<div class="wf-prop-row"><label>${esc(label)}</label><div class="wf-bound-chip"><span>bound: ${esc(desc)}</span><button data-unbind="${esc(arg)}">unbind</button></div></div>`;
    }
    const val=(n.config||{})[arg]||'';
    return `<div class="wf-prop-row"><label>${esc(label)}</label><input data-cfg="${esc(arg)}" value="${esc(val)}" placeholder="literal value, or drag a connection from an earlier step"></div>`;
  }

  paintMeta(); paintPalette(); paintCanvas(); paintProps();
  await loadGraphList();

  // ── palette drag-out ──
  $('#mw_palette').addEventListener('dragstart',(e)=>{
    const item=e.target.closest('[draggable="true"]'); if(!item)return;
    if(item.classList.contains('locked')){e.preventDefault();return;}
    e.dataTransfer.setData('text/plain', JSON.stringify({kind:item.dataset.kind, tool:item.dataset.tool||''}));
  });

  // ── canvas drop (new node) ──
  const canvasWrap=$('#mw_canvas_wrap');
  canvasWrap.addEventListener('dragover',(e)=>{e.preventDefault(); canvasWrap.querySelector('.wf-canvas').classList.add('dragover');});
  canvasWrap.addEventListener('dragleave',()=>{canvasWrap.querySelector('.wf-canvas').classList.remove('dragover');});
  canvasWrap.addEventListener('drop',(e)=>{
    e.preventDefault(); canvasWrap.querySelector('.wf-canvas').classList.remove('dragover');
    let payload; try{payload=JSON.parse(e.dataTransfer.getData('text/plain'));}catch(err){return;}
    if(!payload.kind || payload.kind==='trigger')return; // there is exactly one trigger, seeded once, never offered in the palette
    const canvas=$('#mw_canvas'); const rect=canvas.getBoundingClientRect();
    const x=Math.max(0,e.clientX-rect.left-90), y=Math.max(0,e.clientY-rect.top-20);
    const node={nodeId:mwNodeId(), kind:payload.kind, title:'', tool:payload.tool||'', config:{}, inputBindings:{}, position:{x,y}};
    if(node.kind==='llm_transform')node.config={kind:'summarize',instruction:''};
    if(node.kind==='approval_gate')node.config={reason:'Please review before continuing',risk_level:'medium'};
    MW.nodes.push(node); MW.selected=node.nodeId;
    paintCanvas(); paintProps();
  });

  // ── node select / drag / delete, and port connect ──
  let dragNode=null, dragStart=null, dragged=false, pendingEdge=null;
  const canvasEl=$('#mw_canvas');
  canvasEl.addEventListener('mousedown',(e)=>{
    const del=e.target.closest('[data-del]');
    if(del){MW.nodes=MW.nodes.filter(n=>n.nodeId!==del.dataset.del);
      MW.nodes.forEach(n=>{Object.keys(n.inputBindings||{}).forEach(arg=>{if(n.inputBindings[arg].node_id===del.dataset.del)delete n.inputBindings[arg];});});
      if(MW.selected===del.dataset.del)MW.selected=null;
      paintCanvas(); paintProps(); return;}
    const port=e.target.closest('.wf-port');
    if(port && port.dataset.dir==='out'){
      pendingEdge={sourceNode:port.dataset.node, sourcePin:port.dataset.pin};
      e.preventDefault(); return;
    }
    const nodeEl=e.target.closest('.wf-node');
    if(nodeEl){
      dragNode=nodeEl.dataset.nodeId; dragStart={x:e.clientX,y:e.clientY}; dragged=false;
      e.preventDefault();
    }
  });
  window.addEventListener('mousemove',(e)=>{
    if(dragNode){
      const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
      if(Math.abs(dx)>3||Math.abs(dy)>3)dragged=true;
      if(dragged){
        const n=mwNodeById(dragNode); if(n){n.position={x:Math.max(0,(n.position.x||0)+dx),y:Math.max(0,(n.position.y||0)+dy)};
          const el=canvasEl.querySelector(`[data-node-id="${cssEsc(dragNode)}"]`); if(el){el.style.left=n.position.x+'px'; el.style.top=n.position.y+'px';}
          mwRedrawEdges();}
        dragStart={x:e.clientX,y:e.clientY};
      }
    }
    if(pendingEdge){mwRedrawEdges();}
  });
  window.addEventListener('mouseup',(e)=>{
    if(dragNode && !dragged){MW.selected=dragNode; paintCanvas(); paintProps();}
    dragNode=null;
    if(pendingEdge){
      const port=e.target.closest && e.target.closest('.wf-port');
      if(port && port.dataset.dir==='in'){
        const targetNode=mwNodeById(port.dataset.node);
        if(targetNode && !mwWouldCreateCycle(pendingEdge.sourceNode,targetNode.nodeId)){
          targetNode.inputBindings=targetNode.inputBindings||{};
          targetNode.inputBindings[port.dataset.pin]={source:'node',node_id:pendingEdge.sourceNode,path:pendingEdge.sourcePin};
          delete (targetNode.config||{})[port.dataset.pin];
        } else if(port.dataset.node){
          toast('That connection would create a cycle',true);
        }
      }
      pendingEdge=null; paintCanvas(); paintProps();
    }
  });

  // ── properties panel edits (change = commit; avoids losing focus mid-keystroke) ──
  $('#mw_props').addEventListener('change',(e)=>{
    const n=mwNodeById(MW.selected); if(!n)return;
    const cfg=e.target.closest('[data-cfg]');
    if(cfg){n.config=n.config||{}; n.config[cfg.dataset.cfg]=e.target.value; paintCanvas(); return;}
  });
  $('#mw_props').addEventListener('click',(e)=>{
    const unbind=e.target.closest('[data-unbind]'); if(!unbind)return;
    const n=mwNodeById(MW.selected); if(!n)return;
    delete n.inputBindings[unbind.dataset.unbind];
    paintCanvas(); paintProps();
  });

  // ── toolbar ──
  $('#mw_new').onclick=()=>{MW={...mwBlankState(),catalog:MW.catalog,catalogByTool:MW.catalogByTool}; $('#mw_select').value=''; paintMeta();paintCanvas();paintProps();$('#mw_validate_box').innerHTML='';$('#mw_run_box').innerHTML='';};
  $('#mw_select').onchange=async()=>{
    const gid=$('#mw_select').value;
    if(!gid){$('#mw_new').onclick();return;}
    try{
      const g=await api(`/workflow-graphs/${encodeURIComponent(gid)}`);
      MW={...MW, graphId:g.graphId, displayName:g.displayName, description:g.description||'', status:g.status, publishedVersion:g.publishedVersion,
        nodes:(g.nodes||[]).map(n=>({nodeId:n.nodeId,kind:n.kind,title:n.title,tool:n.tool,config:n.config||{},inputBindings:n.inputBindings||{},position:n.position||{x:30,y:40}})),
        selected:null};
      paintMeta(); paintCanvas(); paintProps(); $('#mw_validate_box').innerHTML=''; $('#mw_run_box').innerHTML='';
    }catch(e){toast(e.message,true);}
  };
  function mwPayload(){return {displayName:MW.displayName, description:MW.description, nodes:MW.nodes, edges:mwDerivedEdges(MW.nodes)};}
  function renderValidateResult(r){
    const blockers=(r.blockers||[]).map(x=>`<li>${esc(x)}</li>`).join('');
    $('#mw_validate_box').innerHTML=`<div class="card" style="margin:0"><div class="row" style="justify-content:space-between"><b>Readiness</b><span class="pill ${r.ready?'ok':'warn'}">${r.ready?'Ready':'Needs attention'}</span></div>${blockers?`<div class="err" style="margin-top:.5rem"><ul style="margin:.35rem 0 0 1rem">${blockers}</ul></div>`:''}</div>`;
  }
  $('#mw_validate').onclick=async()=>{
    if(!MW.graphId){toast('Save the workflow first',true);return;}
    try{const r=await api(`/workflow-graphs/${encodeURIComponent(MW.graphId)}/validate`,{method:'POST',body:JSON.stringify(mwPayload())}); renderValidateResult(r);}
    catch(e){toast(e.message,true);}
  };
  $('#mw_save').onclick=async()=>{
    try{
      if(!MW.graphId){
        const r=await api('/workflow-graphs',{method:'POST',body:JSON.stringify(mwPayload())});
        MW.graphId=r.graphId; MW.status=r.status; MW.publishedVersion=r.publishedVersion;
        toast('Workflow saved as a new draft');
      }else{
        const r=await api(`/workflow-graphs/${encodeURIComponent(MW.graphId)}/versions`,{method:'POST',body:JSON.stringify(mwPayload())});
        MW.status=r.status; MW.publishedVersion=r.publishedVersion;
        toast('New draft version saved');
      }
      paintMeta(); await loadGraphList(); $('#mw_select').value=MW.graphId;
    }catch(e){renderValidateResult({ready:false,blockers:[e.message]});toast(e.message,true);}
  };
  $('#mw_publish').onclick=async()=>{
    if(!MW.graphId){toast('Save the workflow first',true);return;}
    try{const r=await api(`/workflow-graphs/${encodeURIComponent(MW.graphId)}/publish`,{method:'POST',body:JSON.stringify({})});
      MW.status=r.status; MW.publishedVersion=r.publishedVersion; paintMeta(); toast('Published v'+r.publishedVersion); await loadGraphList(); $('#mw_select').value=MW.graphId;
    }catch(e){toast(e.message,true);}
  };
  $('#mw_run').onclick=async()=>{
    if(!MW.graphId){toast('Save and publish the workflow first',true);return;}
    if(MW.status!=='active'){toast('Publish the workflow before running it',true);return;}
    const raw=prompt('Run inputs as JSON (leave as {} for none):','{}'); if(raw===null)return;
    let body; try{body=JSON.parse(raw||'{}');}catch(e){toast('Inputs must be valid JSON',true);return;}
    $('#mw_run_box').innerHTML='<p class="muted">Running...</p>';
    try{
      const r=await api(`/workflows/${encodeURIComponent(MW.graphId)}/run`,{method:'POST',body:JSON.stringify(body)});
      $('#mw_run_box').innerHTML=`<div class="card" style="margin:0"><div class="row"><span class="pill ${r.status==='approval_required'?'pending':'ok'}">${esc(r.status)}</span><span class="mono muted">${esc(r.runId)}</span></div>${r.approval?`<p class="muted" style="margin-top:.5rem">Approval requested: <span class="mono">${esc(r.approval.approvalId)}</span> -- approve it, then Resume from the Workflows tab.</p>`:''}<div class="grid" style="margin-top:.7rem">${(r.artifacts||[]).map(a=>`<div class="card" style="margin:0"><b>${esc(a.filename||a.title||'artifact')}</b>${a.downloadUrl?`<div class="row" style="margin-top:.4rem"><a href="${esc(a.downloadUrl)}">Download</a></div>`:''}</div>`).join('')}</div></div>`;
    }catch(e){$('#mw_run_box').innerHTML=`<p class="err">${esc(e.message)}</p>`;}
  };
}

        <div style="margin-top:.8rem"><h3>Document editor</h3>${oo?`<p class="muted">ONLYOFFICE ${esc(oo.config.editorConfig.mode)} mode -- ${oo.config.editorConfig.mode==='edit'?'edits are saved as a new artifact version automatically.':'read-only preview.'}</p><div id="fl_oo_editor" style="height:70vh;border:1px solid var(--gray200);border-radius:8px;overflow:hidden"></div>`:'<p class="muted">Set ONLYOFFICE_DOCUMENT_SERVER_URL to enable an embedded preview/editor for this file type.</p>'}</div>
        <div class="grid" style="margin-top:.8rem"><div><h3>Shares</h3><div class="tbl-wrap"><table><tbody id="fl_share_rows">${shareRows}</tbody></table></div></div></div>

        <div class="grid" style="margin-top:.8rem"><div><h3>Document reviews</h3><div class="tbl-wrap"><table><thead><tr><th>Review</th><th>Status</th><th>Requested</th><th></th></tr></thead><tbody id="fl_review_rows">${reviewRows}</tbody></table></div></div><div><h3>Approvals</h3>${(w.approvals||[]).length?`<div class="tbl-wrap"><table><tbody>${w.approvals.map(x=>`<tr><td>${esc(x.reason)}</td><td><span class="pill ${x.status==='approved'?'ok':(x.status==='denied'?'warn':'pending')}">${esc(x.status)}</span></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No approval records for this artifact yet.</p>'}</div></div>
        <div style="margin-top:.8rem"><h3>Lifecycle</h3><p class="muted">Owner and admin actions are audited. Shared users can inspect or download only when a share grant allows it.</p></div></div>`;
      if(oo && oo.enabled){
        _loadOnlyofficeApi(oo.documentServerUrl).then(DocsAPI=>{
          if(selectedFile!==a.artifactId)return; // navigated away before the script finished loading
          ooEditor=new DocsAPI.DocEditor('fl_oo_editor',oo.config);
        }).catch(e=>{const el=$('#fl_oo_editor'); if(el)el.innerHTML=`<p class="err" style="padding:.6rem">${esc(e.message)}</p>`;});
      }
      $('#fl_doc_review').onclick=async()=>{
        const reason=prompt('Document review reason:',`Review ${a.filename}`); if(reason===null)return;
        const provider=oo?'onlyoffice':'local';
        try{await api(`/artifacts/${encodeURIComponent(a.artifactId)}/reviews`,{method:'POST',body:JSON.stringify({reason,provider})});toast('Document review started');await inspect(a.artifactId);}catch(e){toast(e.message,true);}
      };
      $('#fl_review').onclick=async()=>{
        const reason=prompt('Approval request reason:',`Approve ${a.filename}`); if(reason===null)return;
        try{await api(`/artifacts/${encodeURIComponent(a.artifactId)}/request-approval`,{method:'POST',body:JSON.stringify({reason,risk_level:'medium'})});toast('Approval requested');await inspect(a.artifactId);}catch(e){toast(e.message,true);}
      };
      $('#fl_version').onclick=async()=>{
        const text=prompt('Paste replacement text for the new version:', ''); if(text===null)return;
        const note=prompt('Version note:', 'Edited in workbench')||'';
        try{await api(`/artifacts/${encodeURIComponent(a.artifactId)}/versions`,{method:'POST',body:JSON.stringify({filename:a.filename,text,note,mime_type:a.mimeType||'text/plain; charset=utf-8'})});toast('Version created');await load();await inspect(a.artifactId);}catch(e){toast(e.message,true);}
      };
      $('#fl_share').onclick=async()=>{
        const shared_with=prompt('Share with username:',''); if(!shared_with)return;
        const perms=confirm('Allow downloads too?')?['view','download']:['view'];
        try{await api(`/artifacts/${encodeURIComponent(a.artifactId)}/shares`,{method:'POST',body:JSON.stringify({shared_with,permissions:perms,expires_in_days:14})});toast('Artifact shared');await inspect(a.artifactId);}catch(e){toast(e.message,true);}
      };
      $('#fl_delete').onclick=async()=>{
        if(!confirm(`Delete ${a.filename}?`))return;
        try{await api(`/artifacts/${encodeURIComponent(a.artifactId)}`,{method:'DELETE'});toast('Artifact deleted');$('#fl_detail').innerHTML='';await load();}catch(e){toast(e.message,true);}
      };
      $('#fl_share_rows').onclick=async(e)=>{const b=e.target.closest('[data-revoke]'); if(!b)return; try{await api(`/artifacts/${encodeURIComponent(a.artifactId)}/shares/${encodeURIComponent(b.dataset.revoke)}/revoke`,{method:'POST'});toast('Share revoked');await inspect(a.artifactId);}catch(err){toast(err.message,true);}};
      $('#fl_review_rows').onclick=async(e)=>{
        const apply=e.target.closest('[data-apply-comment]');
        if(apply){askAssistant(`Apply this requested change to artifact ${apply.dataset.applyComment} (${a.filename}): "${apply.dataset.commentBody}"`); return;}
        const c=e.target.closest('[data-review-comment]');
        if(c){const body=prompt('Review comment:',''); if(!body)return; try{await api(`/artifacts/${encodeURIComponent(a.artifactId)}/reviews/${encodeURIComponent(c.dataset.reviewComment)}/comments`,{method:'POST',body:JSON.stringify({body})});toast('Comment added');await inspect(a.artifactId);}catch(err){toast(err.message,true);} return;}
        const ap=e.target.closest('[data-review-approve]');
        if(ap){const decision=prompt('Decision note:','Approved for delivery')||''; try{await api(`/artifacts/${encodeURIComponent(a.artifactId)}/reviews/${encodeURIComponent(ap.dataset.reviewApprove)}/approve`,{method:'POST',body:JSON.stringify({decision})});toast('Review approved');await inspect(a.artifactId);}catch(err){toast(err.message,true);} return;}
        const ch=e.target.closest('[data-review-changes]');
        if(ch){const decision=prompt('Requested changes:','Please revise before delivery')||''; try{await api(`/artifacts/${encodeURIComponent(a.artifactId)}/reviews/${encodeURIComponent(ch.dataset.reviewChanges)}/changes`,{method:'POST',body:JSON.stringify({decision})});toast('Changes requested');await inspect(a.artifactId);}catch(err){toast(err.message,true);} return;}
      };
      const sendBtn=$('#fl_send');
      if(sendBtn)sendBtn.onclick=async()=>{
        const approval_id=prompt('Approved approval id for this draft:',''); if(!approval_id)return;
        try{const r=await api('/dashboard/try-tool',{method:'POST',body:JSON.stringify({tool:'send_email_draft',args:{draft_id:a.artifactId,approval_id}})}); const res=r.result||{}; toast(res.sendStatus||res.status||'Queued'); go('sends');}
        catch(e){toast(e.message,true);}
      };
      const calBtn=$('#fl_cal_send');
      if(calBtn)calBtn.onclick=async()=>{
        const approval_id=prompt('Approved approval id for this invite:',''); if(!approval_id)return;
        try{const r=await api('/dashboard/try-tool',{method:'POST',body:JSON.stringify({tool:'send_calendar_invite',args:{draft_id:a.artifactId,approval_id}})}); const res=r.result||{}; toast(res.sendStatus||res.status||'Queued'); go('calendar');}
        catch(e){toast(e.message,true);}
      };
    }catch(e){$('#fl_detail').innerHTML=`<div class="card"><p class="err">${esc(e.message)}</p></div>`;}
  }
  async function upload(){
    const f=$('#fl_file').files[0], text=$('#fl_text').value;
    const body={title:$('#fl_title').value.trim()||(f?f.name:'Uploaded note'),classification:[$('#fl_class').value]};
    if(f){const buf=await f.arrayBuffer(); const bytes=new Uint8Array(buf); let bin=''; for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]); body.filename=f.name; body.content_base64=btoa(bin); body.mime_type=f.type||'application/octet-stream';}
    else if(text.trim()){body.filename=(body.title||'uploaded-note').replace(/[^A-Za-z0-9_.-]+/g,'_')+'.txt'; body.text=text; body.mime_type='text/plain; charset=utf-8';}
    else{toast('Choose a file or paste text first',true);return;}
    try{const r=await api('/artifacts',{method:'POST',body:JSON.stringify(body)});toast('Artifact uploaded');$('#fl_file').value='';$('#fl_text').value='';await load();await inspect(r.artifactId);}catch(e){toast(e.message,true);}
  }
  async function load(){
    const r=await api('/artifacts');
    $('#fl_rows').innerHTML=(r.artifacts||[]).map(a=>`<tr><td><b>${esc(a.title)}</b><div class="muted mono" style="font-size:.72rem">${esc(a.filename)}${a.shared?' | shared':''}</div></td><td>${esc(a.type)}</td><td>${(a.classification||[]).map(c=>`<span class="pill">${esc(c)}</span>`).join(' ')}</td><td class="num muted">${Math.round((a.sizeBytes||0)/1024)} KB</td><td class="muted num">${a.expiresAt?_fmtWhen(a.expiresAt):'--'}</td><td class="row"><button class="sm ghost" data-inspect="${esc(a.artifactId)}">Inspect</button><a href="${esc(a.downloadUrl)}">Download</a></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No files yet.</td></tr>';
  }
  $('#fl_refresh').onclick=load;
  $('#fl_upload').onclick=upload;
  $('#fl_rows').onclick=(e)=>{const b=e.target.closest('[data-inspect]'); if(b)inspect(b.dataset.inspect);};
  await load();
}

async function renderCodePlans(v){
  v.innerHTML=wrap(`<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>Code planning</h2><p class="muted">Read-only opencode planning for repo changes, reviews, and governed workflow template drafts. This page captures plans only; edits and shell runs need a separate approval path.</p></div><button class="ghost" id="cp_refresh">Refresh</button></div>
    <div class="grid" style="margin-top:.8rem"><label>Mode<select id="cp_mode"><option value="opencode_plan_change">Plan change</option><option value="opencode_review_repo">Review repo</option><option value="opencode_generate_template">Generate template</option></select></label><label>Target / type<input id="cp_target" placeholder="workflow, gateway, template, approval"></label><label>Risk<select id="cp_risk"><option>medium</option><option>low</option><option>high</option></select></label></div>
    <label style="margin-top:.6rem">Request<textarea id="cp_request" rows="5">Add a governed workflow that generates a monthly customer report with Excel and PowerPoint outputs.</textarea></label><div class="row" style="margin-top:.6rem"><button id="cp_run">Create plan</button><button class="ghost" id="cp_review">Governance review</button></div><div id="cp_out" style="margin-top:.8rem"></div></div>
    <div class="card"><h2>Plan history</h2><div class="tbl-wrap" style="margin-top:.7rem"><table><thead><tr><th>Plan</th><th>Type</th><th>Risk</th><th>Owner</th><th>Created</th><th></th></tr></thead><tbody id="cp_rows"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody></table></div></div><div id="cp_detail"></div>`);
  async function load(){
    const r=await api('/code-plans?all=1');
    $('#cp_rows').innerHTML=(r.plans||[]).map(p=>`<tr><td><b>${esc(p.summary||p.request)}</b><div class="muted mono" style="font-size:.72rem">${esc(p.planId)}</div><div class="muted" style="font-size:.76rem">${esc((p.request||'').slice(0,160))}</div></td><td>${esc(p.planType)}</td><td><span class="pill ${p.riskLevel==='high'?'warn':(p.riskLevel==='low'?'ok':'pending')}">${esc(p.riskLevel)}</span></td><td>${esc(p.owner)}</td><td class="muted num">${p.createdAt?_fmtWhen(p.createdAt):'--'}</td><td><button class="sm ghost" data-cp="${esc(p.planId)}">Inspect</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No code plans yet.</td></tr>';
  }
  async function inspect(id){
    const p=await api(`/code-plans/${encodeURIComponent(id)}`);
    const files=(p.proposedFiles||[]).map(f=>`<li class="mono">${esc(f)}</li>`).join('')||'<li class="muted">No files proposed.</li>';
    const cmds=(p.proposedCommands||[]).map(c=>`<li class="mono">${esc(c)}</li>`).join('')||'<li class="muted">No commands proposed.</li>';
    const findings=(p.findings||[]).map(f=>`<li>${esc(f)}</li>`).join('')||'<li class="muted">No findings recorded.</li>';
    const draft=p.templateDraft?`<h3>Template draft</h3><pre class="mono" style="white-space:pre-wrap;background:var(--gray50);border:1px solid var(--gray200);border-radius:8px;padding:.7rem;font-size:.78rem;max-height:300px;overflow:auto">${esc(JSON.stringify(p.templateDraft,null,2))}</pre>`:'';
    $('#cp_detail').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>${esc(p.summary||p.request)}</h2><p class="muted mono">${esc(p.planId)} | ${esc(p.planType)} | ${esc(p.status)}</p></div><button class="ghost" id="cp_approval">Request approval</button></div><p class="muted">${esc(p.request||'')}</p><div class="grid" style="margin-top:.8rem"><div><h3>Proposed files</h3><ul>${files}</ul></div><div><h3>Verification commands</h3><ul>${cmds}</ul></div></div><h3 style="margin-top:.8rem">Findings</h3><ul>${findings}</ul>${draft}</div>`;
    $('#cp_approval').onclick=async()=>{try{const reason=prompt('Approval reason:',`Approve code plan ${p.planId}`); if(reason===null)return; const r=await api(`/code-plans/${encodeURIComponent(p.planId)}/request-approval`,{method:'POST',body:JSON.stringify({reason})});toast('Approval requested');go('approvals');}catch(e){toast(e.message,true);}};
  }
  async function run(mode){
    const request=$('#cp_request').value.trim();
    const target=$('#cp_target').value.trim();
    if(!request && mode!=='opencode_review_repo'){toast('Describe the request first',true);return;}
    let args={};
    if(mode==='opencode_plan_change')args={request,target_area:target,risk_level:$('#cp_risk').value};
    else if(mode==='opencode_review_repo')args={focus:request||target||'governance assistant review',paths:[]};
    else args={goal:request,template_type:target||'workflow'};
    $('#cp_out').innerHTML='<p class="muted">Creating read-only plan...</p>';
    try{const r=await api('/dashboard/try-tool',{method:'POST',body:JSON.stringify({tool:mode,args})}); const res=r.result||{}; $('#cp_out').innerHTML=`<div class="card" style="margin:0"><b>${esc(res.summary||'Plan created')}</b><div class="muted mono" style="font-size:.74rem">${esc(res.planId||'')}</div><p class="muted" style="font-size:.78rem;margin-top:.45rem">${esc(res.message||'Captured')}</p></div>`;toast('Plan captured');await load();if(res.planId)await inspect(res.planId);}catch(e){$('#cp_out').innerHTML=`<p class="err">${esc(e.message)}</p>`;toast(e.message,true);}
  }
  $('#cp_refresh').onclick=load;
  $('#cp_rows').onclick=(e)=>{const b=e.target.closest('[data-cp]'); if(b)inspect(b.dataset.cp);};
  $('#cp_run').onclick=()=>run($('#cp_mode').value);
  $('#cp_review').onclick=()=>run('opencode_review_repo');
  await load();
}

    $('#tp_create').onclick=async()=>{try{const content=JSON.parse($('#tp_content').value||'{}'); const body={display_name:$('#tp_name').value.trim()||'Template',template_type:$('#tp_type').value,description:$('#tp_desc').value.trim(),tags:$('#tp_tags').value.split(',').map(x=>x.trim()).filter(Boolean),allowed_workflow_ids:$('#tp_wfs').value.split(',').map(x=>x.trim()).filter(Boolean),classification:['INTERNAL'],content,notes:'Initial dashboard version'}; const r=await api('/templates',{method:'POST',body:JSON.stringify(body)});toast('Template created');await load();await inspect(r.templateId);}catch(e){toast(e.message,true);}};

  v.innerHTML=wrap(`
    <div class="card"><h2>API key</h2>

      <div class="row"><button id="dv_mint" ${a.status!=='active'?'disabled':''}>${a.has_key?'Rotate key':'Mint key'}</button></div>

    <div class="card"><h2>Connect an MCP client</h2>
      <p class="muted">Point any MCP client at the gateway with your key as a bearer token.</p>
      <pre class="mono" id="dv_snip" style="margin:.5rem 0 0;background:var(--gray50);border:1px solid var(--gray200);border-radius:8px;padding:.7rem .85rem;font-size:.8rem;overflow-x:auto;white-space:pre-wrap">${esc(snippet)}</pre>

    <div class="card"><h2>Tool playground</h2>
      <p class="muted">Run a governed tool as yourself — full policy, scope, and redaction apply, exactly as an agent would see it.</p>
      ${tools.length?`<div class="grid" style="margin-top:.7rem">
        <label>Tool<select id="pg_tool">${tools.map((t,i)=>`<option value="${i}">${esc(t.name)}</option>`).join('')}</select></label>
        <label>Customer ID <span class="muted" style="font-weight:400;text-transform:none">(if account-scoped)</span><input id="pg_cust" placeholder="optional"></label>
      </div>
      <div class="muted" id="pg_desc" style="margin-top:.4rem;font-size:.8rem"></div>
      <label style="margin-top:.6rem">Arguments (JSON)<textarea id="pg_args" rows="3">{}</textarea></label>
      <div class="row" style="margin-top:.6rem"><button id="pg_run">Run tool</button></div>
      <div id="pg_out"></div>`
      :'<p class="empty">You have no granted tools yet — request access under My Access first.</p>'}</div>`);
  $('#dv_mint')?.addEventListener('click',async()=>{try{const r=await api('/dashboard/my-key/rotate',{method:'POST'});
    $('#dv_key').innerHTML=`<div class="key">${esc(r.api_key)}</div>`;toast('Key minted — copy it now');}catch(e){toast(e.message,true);}});
  $('#dv_copy')?.addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText($('#dv_snip').textContent);toast('Copied');});

  $('#pg_tool')?.addEventListener('change',showDesc); showDesc();
  $('#pg_run')?.addEventListener('click',async()=>{

    $('#pg_out').innerHTML='<p class="muted" style="margin-top:.6rem">Running…</p>';

// ── chart + drawer primitives ──────────────────────────────────────────────────
function _donut(segs,opts){opts=opts||{};const size=opts.size||120,thick=opts.thick||18,r=(size-thick)/2,cx=size/2,c=2*Math.PI*r;
  const total=segs.reduce((a,s)=>a+s.value,0)||1;let off=0;
  const arcs=segs.map(s=>{const len=s.value/total*c;const el=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${thick}" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>`;off+=len;return el;}).join('');
  const ctr=opts.center?`<text x="${cx}" y="${cx-1}" text-anchor="middle" dominant-baseline="middle" class="dn" font-size="21" font-weight="700" fill="var(--text)">${esc(opts.center.top)}</text><text x="${cx}" y="${cx+15}" text-anchor="middle" font-size="8" fill="var(--gray700)" letter-spacing="1">${esc(String(opts.center.sub).toUpperCase())}</text>`:'';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--gray100)" stroke-width="${thick}"/>${arcs}${ctr}</svg>`;}
function _legend(items){return `<div class="legend">${items.map(i=>`<span class="lg"><span class="sw" style="background:${i.color}"></span><span class="nm">${esc(i.label)}</span><b>${i.value}</b></span>`).join('')}</div>`;}
function _hbars(items){if(!items||!items.length)return '<p class="empty">No data.</p>';const max=Math.max(1,...items.map(i=>i.n));
  return `<div class="hbars">${items.map(i=>`<div class="hbar"><span class="hl mono" style="font-size:.72rem" title="${esc(i.k)}">${esc(i.k)}</span><div class="trk"><div class="fil" style="width:${(i.n/max*100).toFixed(1)}%"></div></div><span class="hv">${i.n}</span></div>`).join('')}</div>`;}
function _stacked(data){const W=520,H=150,padB=22,padT=14,padL=6,rows=(data||[]),n=rows.length||1;
  const max=Math.max(1,...rows.map(d=>d.ok+d.denied+d.error));
  const bw=Math.min(42,(W-padL*2)/n-10),gap=n>1?((W-padL*2)-bw*n)/(n-1):0,scale=(H-padB-padT)/max;
  const step=Math.ceil(n/8);let x=padL;  // show ~8 axis labels max so they don't overlap
  const cols=rows.map((d,i)=>{const tot=d.ok+d.denied+d.error,h=tot*scale;let y=H-padB;
    const seg=(vv,col)=>{const hh=vv*scale;y-=hh;return hh>0?`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" fill="${col}"><title>${esc(d.label)}: ${vv}</title></rect>`:'';};
    const bars=seg(d.ok,'var(--highlight)')+seg(d.denied,'var(--error)')+seg(d.error,'#b26a00');
    const lab=(i%step===0)?`<text x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="9">${esc(d.label)}</text>`:'';
    const tt=tot?`<text x="${(x+bw/2).toFixed(1)}" y="${(H-padB-h-4).toFixed(1)}" text-anchor="middle" class="dn" font-size="9">${tot}</text>`:'';
    x+=bw+gap;return bars+lab+tt;}).join('');
  return `<svg class="barchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><line x1="${padL}" y1="${H-padB}" x2="${W-padL}" y2="${H-padB}" stroke="var(--gray200)"/>${cols}</svg>`;}
function _heatmap(hm){if(!hm||!hm.grid)return '<p class="empty">No data.</p>';const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],mx=hm.max||1;
  const cell=(vv)=>`<div class="cell" title="${vv} calls"${vv?` style="background:var(--highlight);opacity:${(0.14+0.86*vv/mx).toFixed(2)}"`:''}></div>`;
  let html='<div class="heat"><div></div>';
  for(let h=0;h<24;h++)html+=`<div class="hd">${h%3===0?h:''}</div>`;
  hm.grid.forEach((row,d)=>{html+=`<div class="rl">${days[d]}</div>`+row.map(cell).join('');});
  return html+'</div>';}
function _spark(data,color){if(!data||!data.length)return '';const w=64,h=26,max=Math.max(...data),min=Math.min(...data),rng=(max-min)||1;
  const pts=data.map((d,i)=>[i/((data.length-1)||1)*w,h-2-((d-min)/rng)*(h-6)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${line}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;}
function openDrawer(html){$('#drawer').innerHTML=html;$('#drawer').classList.add('open');$('#backdrop').classList.add('open');}
function closeDrawer(){$('#drawer').classList.remove('open');$('#backdrop').classList.remove('open');}
addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
