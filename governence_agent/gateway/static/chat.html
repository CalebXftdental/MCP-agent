<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontier Dental — Assistant</title>
<style>
  :root{
    --bg:#f5f7f9; --surface:#fff; --ink:#131820; --ink-2:#5a6472; --line:#dce1e7;
    --accent:#0f8a7d; --user:#e6f2f0; --tool:#6d7887;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e131a; --surface:#161d26; --ink:#e7ecf2; --ink-2:#9aa6b2;
           --line:#27313d; --accent:#2cb6a5; --user:#173a35; --tool:#7d8996; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:.7rem 1rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.6rem}
  header b{font-weight:650}
  header .who{margin-left:auto;color:var(--ink-2);font-size:.82rem}
  header a{color:var(--accent);text-decoration:none;font-size:.82rem}
  #log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.7rem;max-width:52rem;width:100%;margin:0 auto}
  .msg{padding:.6rem .85rem;border-radius:10px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:var(--user)}
  .bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
  .tools{align-self:flex-start;color:var(--tool);font-size:.72rem;font-family:ui-monospace,Consolas,monospace}
  form{display:flex;gap:.5rem;padding:.8rem 1rem;border-top:1px solid var(--line);max-width:52rem;width:100%;margin:0 auto}
  #q{flex:1;padding:.6rem .8rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
  button{padding:.6rem 1rem;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .hint{color:var(--ink-2);font-size:.85rem;text-align:center;margin:auto}
</style>
<header>
  <b>Frontier Dental — Assistant</b>
  <span class="who" id="who"></span>
  <a href="/dashboard">My access</a>
</header>
<div id="log">
  <div class="hint">Ask about customers, orders, shipments, or invoices.<br>
  e.g. “find the customer jane@example.com” then “show their recent orders”.</div>
</div>
<form id="f">
  <input id="q" placeholder="Ask a question…" autocomplete="off" autofocus>
  <button id="send">Send</button>
</form>
<script>
  const log = document.getElementById('log');
  const conversationId = 'chat-' + Math.random().toString(36).slice(2);
  let history = [];

  fetch('/dashboard/me', {credentials:'same-origin'})
    .then(r => r.ok ? r.json() : null)
    .then(j => { if (j) document.getElementById('who').textContent = j.name + ' · ' + j.role; })
    .catch(()=>{});

  function add(cls, text){
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = document.getElementById('q');
    const msg = q.value.trim();
    if (!msg) return;
    const hint = log.querySelector('.hint'); if (hint) hint.remove();
    add('me', msg);
    q.value = '';
    const btn = document.getElementById('send'); btn.disabled = true;
    const pending = add('bot', '…');
    try {
      const r = await fetch('/chat', {
        method:'POST', credentials:'same-origin',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({ message: msg, conversation_id: conversationId })
      });
      const j = await r.json().catch(()=>({}));
      if (!r.ok){ pending.textContent = j.error || ('Error ' + r.status); }
      else {
        pending.textContent = j.reply || '(no reply)';
        if (j.tool_calls && j.tool_calls.length){
          add('tools', 'used: ' + j.tool_calls.map(t=>t.tool).join(', '));
        }
      }
    } catch(err){ pending.textContent = 'Request failed: ' + err; }
    finally { btn.disabled = false; q.focus(); }
  });
</script>
